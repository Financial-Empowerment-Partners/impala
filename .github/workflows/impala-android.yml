# =============================================================================
# CI for the Android sub-projects: impala-android-demo + impala-lib.
#
# Triggers:
#   - Push or PR to main on paths under impala-android-demo/, impala-lib/, or
#     impala-card/. impala-card is included because impala-lib pulls
#     :impala-card:sdk via a composite build (see impala-lib/settings.gradle.kts),
#     so a regression in :sdk can break the lib build/tests.
#   - Manual workflow_dispatch.
#
# Jobs:
#   unit-tests          JVM unit tests. Demo runs both flavors
#                       (testTnetDebugUnitTest, testLiveDebugUnitTest); lib
#                       is flavor-agnostic. Robolectric covers minSdk + targetSdk
#                       in a single invocation via @Config(sdk = [24, 36]).
#                       (The "tnet" flavor is the Stellar-testnet build; the
#                       flavor token can't start with "test" per AGP.)
#   assemble            assembleTnetDebug + assembleLiveDebug for the demo
#                       (two APKs uploaded as separate artifacts) and
#                       assembleDebug for the lib (single AAR).
#   instrumented-tests  Matrix on api-level [24, 36]. Runs the tnet flavor's
#                       connectedTnetDebugAndroidTest (live flavor exercises
#                       the same code paths and would just double emulator boot
#                       time). lib's instrumented tests also run.
#
# No external secrets required.
# =============================================================================

name: impala-android

on:
  push:
    branches: [main]
    paths:
      - 'impala-android-demo/**'
      - 'impala-lib/**'
      - 'impala-card/**'
      - '.github/workflows/impala-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'impala-android-demo/**'
      - 'impala-lib/**'
      - 'impala-card/**'
      - '.github/workflows/impala-android.yml'
  workflow_dispatch:

concurrency:
  group: impala-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Unit tests — JVM-side, Robolectric multi-SDK for the SDK-sensitive classes.
  # ===========================================================================
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # JDK 21, not 17: the unit-test JVM is the Gradle JVM, and Robolectric's
      # API-36 sandbox (@Config(sdk = [24, 36])) hard-requires Java 21 at test
      # runtime. Compiled bytecode still targets 17 (compileOptions/jvmTarget),
      # matching the repo-wide JDK 17 toolchain used by the other jobs.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: impala-android-demo unit tests (tnet + live flavors)
        working-directory: impala-android-demo
        run: ./gradlew testTnetDebugUnitTest testLiveDebugUnitTest --no-daemon --stacktrace

      - name: impala-lib unit tests
        working-directory: impala-lib
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-unit-test-reports-${{ github.sha }}
          path: |
            impala-android-demo/**/build/reports/tests/**
            impala-android-demo/**/build/test-results/**
            impala-lib/**/build/reports/tests/**
            impala-lib/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # Assemble — debug APK + AAR. Uploaded as artifacts.
  # ===========================================================================
  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # JDK 17: repo-wide build toolchain (see impala-card/README.md
      # "Toolchain: JDK 17"). Only the unit-tests job differs (JDK 21 for the
      # Robolectric API-36 sandbox).
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The live flavor ships a commented-out certificate-pinning template
      # (no production cert exists yet). Fail fast if the pin-set is ever
      # activated while it still contains the placeholder pins — shipping
      # that would brick TLS for every install of the live APK.
      - name: Guard live cert-pinning config (no active placeholder pins)
        run: |
          f=impala-android-demo/app/src/live/res/xml/network_security_config.xml
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" "$f"
          if ! python3 -c "import re,sys; s=open(sys.argv[1]).read(); s=re.sub(r'<!--.*?-->','',s,flags=re.S); sys.exit(1 if ('<pin-set' in s and '_BASE64=' in s) else 0)" "$f"; then
            echo "::error::live network_security_config has an active pin-set with placeholder pins"
            exit 1
          fi

      - name: Assemble demo APKs (tnet + live)
        working-directory: impala-android-demo
        run: ./gradlew assembleTnetDebug assembleLiveDebug --no-daemon --stacktrace

      - name: Assemble lib AAR
        working-directory: impala-lib
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload tnet demo APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impala-android-demo-tnet-debug-${{ github.sha }}
          path: impala-android-demo/app/build/outputs/apk/tnet/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload live demo APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impala-android-demo-live-debug-${{ github.sha }}
          path: impala-android-demo/app/build/outputs/apk/live/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload lib AAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impala-lib-debug-${{ github.sha }}
          path: impala-lib/build/outputs/aar/*-debug.aar
          if-no-files-found: error
          retention-days: 90

  # ===========================================================================
  # Instrumented tests — x86_64 emulator matrix on minSdk + targetSdk.
  #
  # Uses reactivecircus/android-emulator-runner. The first invocation per
  # (api-level, target) creates and caches an AVD snapshot; subsequent runs
  # reuse it. KVM acceleration is enabled via udev rule so the emulator runs
  # at native speed on the hosted runner.
  # ===========================================================================
  instrumented-tests:
    name: Instrumented (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 24
            target: default
          - api-level: 36
            target: google_apis

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # JDK 17: repo-wide build toolchain (see impala-card/README.md
      # "Toolchain: JDK 17"). Only the unit-tests job differs (JDK 21 for the
      # Robolectric API-36 sandbox).
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd impala-android-demo && ./gradlew connectedTnetDebugAndroidTest --no-daemon --stacktrace
            cd ../impala-lib && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}-${{ github.sha }}
          path: |
            impala-android-demo/**/build/reports/androidTests/**
            impala-android-demo/**/build/outputs/androidTest-results/**
            impala-lib/**/build/reports/androidTests/**
            impala-lib/**/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 14
