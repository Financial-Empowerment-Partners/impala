# =============================================================================
# CI for impala-soroban (Soroban smart contracts).
#
# Two independent crates: integration-test/ (the contract, compiles to WASM with
# in-process unit tests) and testnet-tests/ (end-to-end against Stellar testnet —
# needs network + stellar-cli + funded accounts, so it's manual-dispatch only).
# =============================================================================
name: impala-soroban

on:
  push:
    branches: [main]
    paths:
      - 'impala-soroban/**'
      - '.github/workflows/impala-soroban.yml'
  pull_request:
    branches: [main]
    paths:
      - 'impala-soroban/**'
      - '.github/workflows/impala-soroban.yml'
  workflow_dispatch:

concurrency:
  group: impala-soroban-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Contract (fmt, clippy, test, WASM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impala-soroban/integration-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned toolchain, not @stable: lint drift on new stables has broken
        # this CI before. Bump deliberately, fixing clippy/fmt fallout in the
        # same change.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impala-soroban/integration-test/target
          key: ${{ runner.os }}-soroban-${{ hashFiles('impala-soroban/integration-test/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-soroban-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests (in-process, no network)
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Audits the contract crate's Cargo.lock. testnet-tests has no lockfile
      # committed, so it has nothing reproducible to audit.
      - name: Audit dependencies for vulnerabilities
        run: cargo audit

      - name: Build contract WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soroban-impala-integration-test-wasm-${{ github.sha }}
          path: impala-soroban/integration-test/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
          retention-days: 30

  # End-to-end against Stellar testnet. Manual only: slow (ledger latency +
  # timelock waits) and needs network + the stellar CLI.
  testnet-tests:
    name: Testnet e2e (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned toolchain, not @stable — see the contract job.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'
          targets: wasm32-unknown-unknown

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Build contract WASM
        working-directory: impala-soroban/integration-test
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Run testnet tests
        working-directory: impala-soroban/testnet-tests
        run: cargo test
