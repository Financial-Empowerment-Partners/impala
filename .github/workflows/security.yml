# =============================================================================
# Repository-wide secret scanning.
#
# gitleaks scans the FULL git history (fetch-depth: 0) on every push/PR and
# on a weekly schedule, so newly added detection rules re-screen old commits.
# Findings fail the job. Intentional placeholders and vendored sample
# material are allowlisted in /.gitleaks.toml; anything else that trips a
# rule is treated as a real leak — rotate the credential and expunge it from
# history, do not allowlist it.
#
# The scanner image is pinned by digest (the tag comment is for humans; the
# digest is what gets pulled). Bump tag + digest together.
# =============================================================================
name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan git history for secrets
        # The GIT_CONFIG_* env vars mark the bind-mounted checkout as a safe
        # directory inside the container, where git otherwise refuses to read
        # a repository owned by a different uid.
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --verbose
