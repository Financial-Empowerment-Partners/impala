name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday sweep catches new advisories on untouched code

# Every `uses:` is pinned to a full commit SHA (release in the trailing
# comment; Dependabot bumps them) and checkouts never persist GITHUB_TOKEN.
# security-events: write is granted only to the jobs that upload SARIF.
#
# trivy-action, why it must not go stale (2026-09-08): the three trivy jobs
# were failing before the run at all. The previous pin (v0.28.0) is a composite
# action whose first step is `uses: aquasecurity/setup-trivy@v0.2.1`, and
# upstream has since DELETED that tag (only v0.2.6 / v0.3.0 / v0.3.1 remain),
# so the job died at action resolution. Even past that, v0.28.0 asks
# setup-trivy for trivy v0.56.1, and aquasecurity prunes old trivy releases —
# every version below v0.70.0 has already lost its GitHub release assets, so
# the download 404s. v0.36.0 pins setup-trivy by SHA (deletion-proof) and
# defaults to trivy v0.70.0, which still publishes assets.
#
# Consequences for whoever maintains this: (a) do NOT pin the trivy BINARY
# version here — the action's default tracks a release that still exists, a
# hard pin becomes an install failure the day it is pruned; (b) keep the
# action pin moving (Dependabot), because a frozen pin re-acquires both
# failures above. Findings never fail these jobs (no `exit-code`); they upload
# as SARIF, so a scanner bump can change the alert list but cannot turn CI red.
permissions:
  contents: read

jobs:
  # Secret scan. Runs the gitleaks CLI directly instead of gitleaks-action.
  #
  # Why (2026-09-08): gitleaks-action has been proprietary since v2.0.0 and
  # requires a GITLEAKS_LICENSE secret for ORGANISATION-owned repositories —
  # which this repo is — while personal accounts run it free. The scanner
  # itself is unaffected: the gitleaks binary is MIT, free for organisations,
  # and is what did the detecting all along. Dropping the wrapper removes the
  # licence obligation and changes no coverage: same rules, same git-history
  # walk, same .gitleaks.toml and .gitleaksignore.
  #
  # Do not "simplify" this back to the action, and do not switch to a
  # `latest` download: the binary is pinned by version AND verified against
  # the checksum gitleaks publishes with each release, so a tampered or
  # truncated asset fails the job instead of silently scanning nothing.
  secret-scan:
    name: secret scan (gitleaks CLI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bump both together; the digest is from gitleaks_<version>_checksums.txt
      # on the release page.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
      # fetch-depth: 0 is load-bearing — `gitleaks git` walks the whole history,
      # so a shallow clone would scan only the tip commit and report clean.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (MIT binary, checksum-verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 --retry-delay 5 -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "$asset" gitleaks
          ./gitleaks version

      # Two scans, because they cover different things and the repo's
      # suppressions are recorded for both (see .gitleaksignore):
      #   git — every commit in history, catching a secret that was added and
      #         later deleted, which a tree scan cannot see;
      #   dir — the working tree, catching anything present but unreachable
      #         from the scanned history.
      # Both exit non-zero on a finding, which fails the job exactly as the
      # action did. --redact keeps the secret itself out of the public log.
      - name: Scan git history
        run: ./gitleaks git . --redact --verbose --exit-code 1

      - name: Scan working tree
        run: ./gitleaks dir . --redact --verbose --exit-code 1

  trivy-fs:
    name: trivy (filesystem scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Without this the action DELETES the severity filter whenever the
          # format is sarif (entrypoint.sh: "Building SARIF report with all
          # severities"), so the line above would be decorative and every
          # LOW/MEDIUM/UNKNOWN finding would land in code scanning.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-dockerfile:
    name: trivy (Dockerfile config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Trivy config scan (bridge Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: impala-bridge
          severity: CRITICAL,HIGH
          # See the trivy-fs job: sarif output drops `severity` unless this is
          # set.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-dockerfile.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-dockerfile.sarif
          category: trivy-dockerfile

  # trivy replaces the deprecated tfsec, whose parser rejects the
  # Terraform 1.5 `check` blocks used in testnet.tf.
  trivy-terraform:
    name: trivy (terraform IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Trivy config scan (terraform)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: CRITICAL,HIGH
          # See the trivy-fs job: sarif output drops `severity` unless this is
          # set. terraform/ has accepted MEDIUM findings (documented in
          # terraform/README.md) that must not become code-scanning alerts.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-terraform.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

  cargo-deny:
    name: cargo-deny (licenses + advisories + bans)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - impala-bridge
          - impala-soroban/integration-test
          - impala-soroban/testnet-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Same pinned toolchain as ci.yml / impala-soroban.yml (the Dockerfile
      # builds on rust:1.96); cargo-deny only needs `cargo metadata` from it.
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}/Cargo.toml
          command: check advisories bans sources licenses
