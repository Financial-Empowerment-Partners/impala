# =============================================================================
# CI for impala-ui (vanilla JS admin dashboard, served by Nginx).
# Runs the Vitest unit suite over the pure JS modules. No build step.
# =============================================================================
name: impala-ui

on:
  push:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
  workflow_dispatch:

concurrency:
  group: impala-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impala-ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: impala-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-reports-${{ github.sha }}
          path: impala-ui/**/coverage/**
          if-no-files-found: ignore
          retention-days: 14
