# =============================================================================
# CI for impala-ui (vanilla JS admin dashboard, served by Nginx).
# Runs eslint over html/js and the Vitest unit suite over the pure JS
# modules. No build step. (Replaces the legacy ci-ui.yml, which carried the
# lint step but no permissions block and unpinned actions.)
# =============================================================================
name: impala-ui

on:
  push:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
      # tests/custody-view.test.js parses CUSTODIAL_REFUSAL_CODES out of the
      # bridge's constants.rs and asserts CustodyView.REFUSAL_CODES matches
      # it, so a bridge-only edit to that file must run this job or the
      # UI/bridge drift lands unnoticed.
      - 'impala-bridge/src/constants.rs'
  pull_request:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
      # tests/custody-view.test.js parses CUSTODIAL_REFUSAL_CODES out of the
      # bridge's constants.rs and asserts CustodyView.REFUSAL_CODES matches
      # it, so a bridge-only edit to that file must run this job or the
      # UI/bridge drift lands unnoticed.
      - 'impala-bridge/src/constants.rs'
  workflow_dispatch:

concurrency:
  group: impala-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impala-ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: impala-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint covers html/js only (tests/ are ESM and deliberately unlinted —
      # see CLAUDE.md); a lint failure blocks the PR like a test failure.
      - name: Lint (eslint)
        run: npm run lint

      # No artifact-upload step follows on purpose: `npm test` is `vitest run`
      # with reporters: ['default'] and no coverage provider in the tree, so
      # nothing is ever written to disk. The step that used to sit here
      # uploaded `impala-ui/**/coverage/**` with `if-no-files-found: ignore` —
      # a silent no-op that promised failure diagnostics and delivered an empty
      # artifact. Vitest's default reporter prints the whole failure body into
      # the job log. If a real artifact is ever wanted, add vitest's built-in
      # `junit` reporter with an `outputFile` in impala-ui/vitest.config.js and
      # upload that exact path.
      - name: Run unit tests
        run: npm test
