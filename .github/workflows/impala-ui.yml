# =============================================================================
# CI for impala-ui (vanilla JS admin dashboard, served by Nginx).
# Runs eslint over html/js and the Vitest unit suite over the pure JS
# modules. No build step. (Replaces the legacy ci-ui.yml, which carried the
# lint step but no permissions block and unpinned actions.)
# =============================================================================
name: impala-ui

on:
  push:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'impala-ui/**'
      - '.github/workflows/impala-ui.yml'
  workflow_dispatch:

concurrency:
  group: impala-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impala-ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: impala-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # eslint covers html/js only (tests/ are ESM and deliberately unlinted —
      # see CLAUDE.md); a lint failure blocks the PR like a test failure.
      - name: Lint (eslint)
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-reports-${{ github.sha }}
          path: impala-ui/**/coverage/**
          if-no-files-found: ignore
          retention-days: 14
