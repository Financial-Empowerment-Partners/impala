# =============================================================================
# CI for lumencli
#
# Runs fmt-check, vet, and the race-enabled test suite on Linux, a plain test
# pass on Windows, govulncheck, and a six-target cross-build whose artifacts
# are uploaded for a week.
#
# Triggers:
#   - Push to main / pull request: path-filtered to lumencli/** and this file
#   - Manual dispatch
#   - Weekly schedule: a path-filtered workflow never re-checks untouched
#     code, so the weekly run catches NEW vulnerability advisories published
#     after the last code change.
#
# Every `uses:` is pinned to a full commit SHA (release in the trailing
# comment; Dependabot bumps them) and checkouts never persist GITHUB_TOKEN.
# =============================================================================

name: lumencli

on:
  push:
    branches: [main]
    paths:
      - 'lumencli/**'
      - '.github/workflows/lumencli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lumencli/**'
      - '.github/workflows/lumencli.yml'
  workflow_dispatch:
  schedule:
    # Weekly (Monday 06:17 UTC). A path-filtered workflow never re-checks
    # untouched code, so this run catches NEW vulnerability advisories.
    - cron: '17 6 * * 1'

permissions:
  contents: read

defaults:
  run:
    working-directory: lumencli

jobs:
  # ===========================================================================
  # Test — fmt-check, vet, race-enabled tests (Linux)
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: lumencli/go.mod
          cache-dependency-path: lumencli/go.sum

      - name: Check formatting
        run: |
          if ! test -z "$(gofmt -l .)"; then
            echo "unformatted files:"
            gofmt -l .
            gofmt -d .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  # ===========================================================================
  # Test (Windows) — plain tests only.
  #
  # fmt-check must NEVER run on Windows runners: the runner's git autocrlf
  # setting checks files out with CRLF line endings, so gofmt -l would flag
  # every file. The race detector is skipped here as redundant with the
  # ubuntu leg.
  # ===========================================================================
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: lumencli/go.mod
          cache-dependency-path: lumencli/go.sum

      - name: Test
        run: go test ./...

  # ===========================================================================
  # Vulncheck — pinned govulncheck against the whole module
  # ===========================================================================
  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: lumencli/go.mod
          cache-dependency-path: lumencli/go.sum

      # The gate lives in scripts/vulncheck.sh: symbol-level findings fail the
      # job unless they are on the script's justified accept list, so a known
      # unfixable transitive finding cannot train everyone to ignore red.
      - name: Run vulncheck gate
        run: sh scripts/vulncheck.sh

  # ===========================================================================
  # Cross — build all six release targets, mirroring the Makefile cross target
  # ===========================================================================
  cross:
    name: Cross-build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so git describe can see tags for the stamped version.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: lumencli/go.mod
          cache-dependency-path: lumencli/go.sum

      - name: Build all six targets
        run: |
          VERSION="$(git describe --always --dirty 2>/dev/null || echo dev)"
          mkdir -p dist
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              if [ "$os" = "windows" ]; then ext=".exe"; else ext=""; fi
              out="dist/lumencli_${VERSION}_${os}_${arch}${ext}"
              echo "building $out"
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath \
                  -ldflags "-s -w -X lumencli/internal/cli.version=${VERSION} -X lumencli/internal/stellar.appVersion=${VERSION}" \
                  -o "$out" .
            done
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumencli-dist
          path: lumencli/dist/
          retention-days: 7
