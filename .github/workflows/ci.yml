# =============================================================================
# CI/CD Pipeline for impala-bridge
#
# Builds multi-arch Docker images (amd64 + arm64/Graviton) and optionally
# deploys to AWS via Terraform.
#
# Triggers:
#   - Push to main: build + push to ECR + optional deploy
#   - Pull request: build + test only (no push)
#   - Manual dispatch: full control over architecture, deploy, and environment
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID         - AWS account ID for ECR
#   AWS_REGION             - Primary AWS region (e.g. us-east-1)
#   AWS_ROLE_ARN           - IAM role ARN for OIDC federation (recommended)
#                            OR AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#
# Optional Secrets (for Terraform deploy):
#   TF_VAR_testnet_jwt_secret           - JWT secret for testnet cluster
#   TF_VAR_testnet_soroban_contract_id  - Soroban contract on testnet
#   TF_VAR_testnet_certificate_arn      - ACM cert ARN for testnet HTTPS (optional)
#   TF_VAR_live_jwt_secret              - JWT secret for live cluster
#   TF_VAR_live_certificate_arn         - ACM cert ARN for live HTTPS (optional)
#
# Optional Repository Variables (vars, not secrets):
#   TESTNET_ENABLED  - "true" to enable testnet stack (default false)
#   LIVE_ENABLED     - "true" to enable live stack (default false)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    tags:
      - 'impala-bridge-v*'
    paths:
      - 'impala-bridge/**'
      - '.github/workflows/ci.yml'
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'impala-bridge/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture(s)'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      deploy:
        description: 'Deploy to AWS after build'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Deployment environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      terraform_action:
        description: 'Terraform action'
        required: false
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: impala-bridge

permissions:
  id-token: write
  contents: read

# Avoid racing/duplicate runs on the same ref. PRs cancel in-progress runs;
# main pushes (which may deploy) are allowed to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # Test — Run cargo test and clippy
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impala-bridge

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned toolchain, not @stable: lint drift on new stables has broken
        # this CI before. Bump deliberately, fixing clippy/fmt fallout in the
        # same change.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impala-bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('impala-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies for vulnerabilities
        run: cargo audit

  # ===========================================================================
  # Build — Multi-arch Docker image build + push to ECR
  # ===========================================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check if architecture is requested
        id: check_arch
        run: |
          PLATFORMS="${{ github.event.inputs.architecture || 'linux/amd64,linux/arm64' }}"
          if echo "$PLATFORMS" | grep -q "${{ matrix.platform }}"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.check_arch.outputs.should_build == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check_arch.outputs.should_build == 'true'
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Set up Docker Buildx
        if: steps.check_arch.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker metadata
        if: steps.check_arch.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=branch

      - name: Build and push (per-arch)
        if: steps.check_arch.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: impala-bridge
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}
          provenance: false

  # ===========================================================================
  # Manifest — Create multi-arch manifest from per-arch images
  # ===========================================================================
  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2.1.5

      - name: Determine architectures
        id: archs
        run: |
          PLATFORMS="${{ github.event.inputs.architecture || 'linux/amd64,linux/arm64' }}"
          SOURCES=""
          if echo "$PLATFORMS" | grep -q "linux/amd64"; then
            SOURCES="$SOURCES ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64"
          fi
          if echo "$PLATFORMS" | grep -q "linux/arm64"; then
            SOURCES="$SOURCES ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64"
          fi
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"

          LATEST_SOURCES=""
          if echo "$PLATFORMS" | grep -q "linux/amd64"; then
            LATEST_SOURCES="$LATEST_SOURCES ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64"
          fi
          if echo "$PLATFORMS" | grep -q "linux/arm64"; then
            LATEST_SOURCES="$LATEST_SOURCES ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64"
          fi
          echo "latest_sources=$LATEST_SOURCES" >> "$GITHUB_OUTPUT"

      - name: Create and push SHA manifest
        run: |
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ steps.archs.outputs.sources }}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Create and push latest manifest
        run: |
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ steps.archs.outputs.latest_sources }}
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ===========================================================================
  # Lint Dockerfile — hadolint (no creds). BLOCKING: accepted findings carry
  # inline `# hadolint ignore=` annotations in impala-bridge/Dockerfile.
  # ===========================================================================
  lint-docker:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint hadolint - < impala-bridge/Dockerfile

  # ===========================================================================
  # Terraform checks — fmt, validate (root + modules + bootstrap), lint, IaC
  # security scan. No AWS creds needed. Gates deploy. tflint and trivy are
  # BLOCKING (baseline triaged 2026-06-09: accepted findings carry justified
  # #trivy:ignore annotations in the .tf files; AVD-AWS-0052 was fixed via
  # drop_invalid_header_fields instead of ignored).
  # ===========================================================================
  terraform-checks:
    name: Terraform checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.15"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate (root + modules + bootstrap)
        run: |
          terraform init -backend=false
          terraform validate
          for d in modules/*/ bootstrap; do
            if [ -d "$d" ]; then
              echo "== validate $d =="
              (cd "$d" && terraform init -backend=false && terraform validate)
            fi
          done

      - name: tflint
        run: |
          curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --recursive --no-color

      - name: Trivy IaC config scan
        # Two blocking passes: the default pass covers root/bootstrap/ecr as
        # evaluated for a toggles-off plan; the --tf-vars pass forces all
        # three stack toggles on (trivy-scan.tfvars, scanner-only file) so
        # modules/ecs-stack and modules/impala-stack are fully evaluated too.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy config --severity HIGH,CRITICAL --exit-code 1 .
          trivy config --severity HIGH,CRITICAL --exit-code 1 --tf-vars trivy-scan.tfvars .

  # ===========================================================================
  # Plan — informational terraform plan, ungated. The plan output goes to the
  # job log and the step summary for review. The plan file is deliberately NOT
  # uploaded as an artifact (artifacts outlive the job and a tfplan embeds
  # sensitive variable values); the gated apply job re-plans atomically.
  # ===========================================================================
  plan:
    name: Terraform plan
    needs: [manifest, terraform-checks]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.15"

      - name: Terraform Init
        # Backend config (bucket/key/region/lock table) supplied here; see backend.tf.
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=impala/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform Plan (informational)
        run: |
          set -o pipefail
          terraform plan \
            -var="container_image_tag=${{ github.sha }}" \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}" \
            -var="testnet_enabled=${{ vars.TESTNET_ENABLED || 'false' }}" \
            -var="live_enabled=${{ vars.LIVE_ENABLED || 'false' }}" \
            -no-color 2>&1 | tee /tmp/tfplan.log
          {
            echo "## Terraform plan (${{ github.event.inputs.environment || 'staging' }})"
            echo '```'
            tail -n 400 /tmp/tfplan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TF_VAR_testnet_jwt_secret: ${{ secrets.TF_VAR_testnet_jwt_secret }}
          TF_VAR_testnet_soroban_contract_id: ${{ secrets.TF_VAR_testnet_soroban_contract_id }}
          TF_VAR_testnet_certificate_arn: ${{ secrets.TF_VAR_testnet_certificate_arn }}
          TF_VAR_live_jwt_secret: ${{ secrets.TF_VAR_live_jwt_secret }}
          TF_VAR_live_certificate_arn: ${{ secrets.TF_VAR_live_certificate_arn }}

  # ===========================================================================
  # Apply — gated terraform apply.
  #
  # *** MANUAL REPO-SETTINGS STEP — REQUIRED BEFORE THIS CHANGE MERGES ***
  # This job is gated on a GitHub Environment named `production`, which cannot
  # be created from repository files. A repo admin must, under
  # Settings → Environments → New environment:
  #   1. Create an environment named exactly `production`.
  #   2. Add required reviewers (the operators who approve applies).
  #   3. Restrict deployment branches to `main` only.
  # Until that exists, GitHub runs this job WITHOUT a manual approval pause —
  # an unknown environment name does not block execution.
  #
  # The job re-plans and applies in one step (plan -out + apply of that file
  # in the same shell) instead of consuming a plan artifact, so the applied
  # plan can never be a stale or tampered file from another job.
  # ===========================================================================
  apply:
    name: Terraform apply
    needs: plan
    runs-on: ubuntu-latest
    if: >
      github.event.inputs.terraform_action == 'apply' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~> 1.15"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=impala/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform Plan + Apply (atomic)
        run: |
          terraform plan \
            -var="container_image_tag=${{ github.sha }}" \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}" \
            -var="testnet_enabled=${{ vars.TESTNET_ENABLED || 'false' }}" \
            -var="live_enabled=${{ vars.LIVE_ENABLED || 'false' }}" \
            -out=tfplan \
            -no-color
          terraform apply -auto-approve tfplan
        env:
          TF_VAR_testnet_jwt_secret: ${{ secrets.TF_VAR_testnet_jwt_secret }}
          TF_VAR_testnet_soroban_contract_id: ${{ secrets.TF_VAR_testnet_soroban_contract_id }}
          TF_VAR_testnet_certificate_arn: ${{ secrets.TF_VAR_testnet_certificate_arn }}
          TF_VAR_live_jwt_secret: ${{ secrets.TF_VAR_live_jwt_secret }}
          TF_VAR_live_certificate_arn: ${{ secrets.TF_VAR_live_certificate_arn }}

  # ===========================================================================
  # Native binary — glibc Linux tarballs for the GitHub Release.
  # Tag-push-only (impala-bridge-v*). Runs in parallel with the Docker build
  # matrix; reuses the same amd64/arm64 runners.
  # ===========================================================================
  native-build:
    name: Native binary (${{ matrix.platform }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/impala-bridge-v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: impala-bridge

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned toolchain, not @stable — see the test job.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'

      - name: Cache cargo registry + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impala-bridge/target
          key: ${{ runner.os }}-${{ matrix.platform }}-cargo-release-${{ hashFiles('impala-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform }}-cargo-release-

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#impala-bridge-v}"
          STAGE="impala-bridge-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/${STAGE}"
          cp target/release/impala-bridge "dist/${STAGE}/"
          cp README.md "dist/${STAGE}/README.md"
          cp ../LICENSE-2.0.txt "dist/${STAGE}/LICENSE-2.0.txt" 2>/dev/null || true
          tar -czf "dist/${STAGE}.tar.gz" -C dist "${STAGE}"
          (cd dist && sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256")
          ls -la dist

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: impala-bridge-${{ matrix.platform }}
          path: |
            impala-bridge/dist/impala-bridge-*.tar.gz
            impala-bridge/dist/impala-bridge-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  # ===========================================================================
  # GitHub Release — attach the per-arch tarballs to a release named after
  # the tag. Tag-push-only.
  # ===========================================================================
  release:
    name: GitHub Release
    needs: native-build
    if: startsWith(github.ref, 'refs/tags/impala-bridge-v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download tarball artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: impala-bridge-linux-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: impala-bridge ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.tar.gz.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
