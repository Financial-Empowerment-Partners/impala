# =============================================================================
# CI/CD Pipeline for impala-bridge
#
# Builds multi-arch Docker images (amd64 + arm64/Graviton) and optionally
# deploys to AWS via Terraform.
#
# Triggers:
#   - Push to main: build + push to ECR + terraform plan (informational only)
#   - Pull request: test + terraform validate (no push, no plan)
#   - Manual dispatch: full control over architecture, deploy, and environment.
#     `terraform apply` runs ONLY from a dispatch with terraform_action=apply.
#
# Supply-chain posture (keep when editing):
#   - Every `uses:` is pinned to a full commit SHA; the trailing comment names
#     the release it was resolved from and Dependabot's github-actions entry
#     bumps the SHAs. Never reintroduce a mutable tag (@v4, @stable, ...).
#   - Permissions are granted per JOB, not workflow-wide. Only the jobs that
#     talk to AWS (build, manifest, deploy) get `id-token: write`; the
#     PR-triggered test and terraform-check jobs get `contents: read` and
#     nothing else, so code in a pull request can never mint an OIDC token
#     for the deploy role.
#   - Every checkout uses persist-credentials: false so GITHUB_TOKEN is not
#     written into .git/config where a later step could read it.
#   - The Rust toolchain is pinned to the version the Dockerfile builds on
#     (rust:1.96-slim) and clippy/test run --locked, so CI fails instead of
#     silently resolving a different dependency graph than Cargo.lock.
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID         - AWS account ID for ECR
#   AWS_REGION             - Primary AWS region (e.g. us-east-1)
#   AWS_ROLE_ARN           - IAM role ARN for OIDC federation (recommended)
#                            OR AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#
# Optional Secrets (for Terraform deploy):
#   TF_VAR_jwt_secret      - JWT signing secret
#   TF_VAR_signoz_endpoint - SigNoz OTLP endpoint
#   TF_VAR_signoz_access_token - SigNoz access token
#   TF_VAR_testnet_jwt_secret  - JWT secret for testnet cluster
#   TF_VAR_testnet_soroban_contract_id - Soroban contract on testnet
# =============================================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'impala-bridge/**'
      - '.github/workflows/ci.yml'
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'impala-bridge/**'
      - '.github/workflows/ci.yml'
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture(s)'
        required: true
        default: 'linux/amd64,linux/arm64'
        type: choice
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      deploy:
        description: 'Deploy to AWS after build'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Deployment environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      terraform_action:
        description: 'Terraform action'
        required: false
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  IMAGE_NAME: impala-bridge

# Workflow-wide floor. Jobs that need more declare their own `permissions`
# block (which REPLACES this one for that job). `id-token: write` must never
# appear here: it would let the PR-triggered jobs mint OIDC tokens.
permissions:
  contents: read

jobs:
  # ===========================================================================
  # Test — Run cargo test and clippy
  # ===========================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: impala-bridge

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Pinned to the Dockerfile's rust:1.96 builder, not @stable: the image
        # that ships is built on 1.96, so that is the compiler CI must gate on
        # (and lint drift on new stables has broken sibling CI before). Bump
        # together with the Dockerfile FROM line.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.96.0'
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            impala-bridge/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('impala-bridge/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      # --locked: the Dockerfile builds with --locked, so CI must resolve the
      # exact same Cargo.lock graph — an out-of-date lockfile fails here
      # instead of being silently re-resolved.
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # `cargo audit` reads Cargo.lock as-is (it has no --locked flag).
      - name: Audit dependencies for vulnerabilities
        run: cargo audit

  # ===========================================================================
  # Terraform check — PR-time validation, no AWS credentials and no state.
  # Terraform changes merge straight into the tree an operator dispatch will
  # apply, so they must at least validate pre-merge. (A full plan against the
  # real state needs credentials and the operator's tfvars; that still happens
  # on push — plan-only — and on workflow_dispatch.)
  # ===========================================================================
  terraform-check:
    name: Terraform validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # main.tf pins required_version = ">= 1.9, < 2.0"
          terraform_version: "~> 1.9"

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -no-color

  # ===========================================================================
  # Build — Multi-arch Docker image build + push to ECR
  # ===========================================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # id-token: write is what lets configure-aws-credentials assume
    # AWS_ROLE_ARN via OIDC. Scoped to this job (never workflow-wide).
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Check if architecture is requested
        id: check_arch
        run: |
          PLATFORMS="${{ github.event.inputs.architecture || 'linux/amd64,linux/arm64' }}"
          if echo "$PLATFORMS" | grep -q "${{ matrix.platform }}"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.check_arch.outputs.should_build == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check_arch.outputs.should_build == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        if: steps.check_arch.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The ECR repo is IMMUTABLE (terraform/ecr.tf) — every pushed tag must be
      # unique per run, so only the per-commit :<sha>-<arch> tag is pushed.
      # There is deliberately no :latest / :latest-<arch> chain: reused tags
      # are rejected by the immutable repo, and terraform deploys pin
      # container_image_tag = <sha> anyway.
      #
      # provenance: false is deliberate — with mode=max attestations the
      # per-arch push becomes an image index, which the plain
      # `docker manifest create` in the manifest job cannot stitch.
      - name: Build and push (per-arch)
        if: steps.check_arch.outputs.should_build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: impala-bridge
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch_tag }}
          provenance: false

  # ===========================================================================
  # Manifest — Create multi-arch manifest from per-arch images
  # ===========================================================================
  manifest:
    name: Create multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    # No checkout here, so no contents scope either — only the OIDC token.
    permissions:
      id-token: write
    # The :<sha> manifest is the canonical deploy reference (terraform pins
    # container_image_tag = <sha>, and the default task cpu_architecture is
    # ARM64). Publishing it from a single-arch build would put a partial
    # manifest under the canonical tag — and the immutable repo would then
    # refuse to ever complete it. So single-architecture dispatch runs push
    # only their :<sha>-<arch> tag and skip the manifest, which also skips
    # deploy (needs: manifest): a build that can't serve both platforms is
    # never deployable.
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.architecture == 'linux/amd64,linux/arm64')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Create and push SHA manifest
        run: |
          docker manifest create \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-arm64
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ===========================================================================
  # Deploy — Terraform plan/apply (optional)
  # ===========================================================================
  deploy:
    name: Terraform ${{ github.event.inputs.terraform_action || 'plan' }}
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Push to main runs a PLAN ONLY, and non-blocking (continue-on-error):
    # it is informational drift/review output, never an apply. All stacks
    # share the single state key impala/terraform.tfstate and the stack
    # enable flags (testnet_enabled, live_enabled, dr_enabled,
    # impala_enabled) all default to false, so an unattended apply with
    # default variables would plan away any stack an operator enabled with
    # out-of-band tfvars — i.e. destroy live money infrastructure. Applying
    # therefore requires an explicit workflow_dispatch with deploy=true and
    # terraform_action=apply (see the Terraform Apply step). Never re-add a
    # push-triggered apply.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: ${{ github.event_name == 'push' }}
    environment: ${{ github.event.inputs.environment || 'staging' }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # main.tf pins required_version = ">= 1.9, < 2.0"
          terraform_version: "~> 1.9"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=impala/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="container_image_tag=${{ github.sha }}" \
            -var="environment=${{ github.event.inputs.environment || 'staging' }}" \
            -out=tfplan \
            -no-color
        env:
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_signoz_endpoint: ${{ secrets.TF_VAR_signoz_endpoint }}
          TF_VAR_signoz_access_token: ${{ secrets.TF_VAR_signoz_access_token }}
          TF_VAR_testnet_jwt_secret: ${{ secrets.TF_VAR_testnet_jwt_secret }}
          TF_VAR_testnet_soroban_contract_id: ${{ secrets.TF_VAR_testnet_soroban_contract_id }}

      # Apply ONLY on an explicit operator dispatch with terraform_action=apply
      # — never on push. See the job-level comment: push-applies with default
      # variables are destructive over the shared state.
      - name: Terraform Apply
        if: >
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.terraform_action == 'apply'
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
          TF_VAR_signoz_endpoint: ${{ secrets.TF_VAR_signoz_endpoint }}
          TF_VAR_signoz_access_token: ${{ secrets.TF_VAR_signoz_access_token }}
          TF_VAR_testnet_jwt_secret: ${{ secrets.TF_VAR_testnet_jwt_secret }}
          TF_VAR_testnet_soroban_contract_id: ${{ secrets.TF_VAR_testnet_soroban_contract_id }}
