# scardutil simulator target: an Impala card on JavaCard 3.2 hardware.
# The same keys as impala-sim.cfg; see there and README.md.
#
# The card is ImpalaApplet-native.cap (the platform's own EdDSA; the CAP is
# converted for JavaCard 3.1 and loads on 3.2) on a JavaCard 3.2 card that
# offers Ed25519 both as SIG_CIPHER_EDDSA and as the per-curve
# SIG_CIPHER_EDDSA_ED25519 of the 3.2 API. The dispatch sequence passes on it
# unchanged: the applet answers the same whichever engine made the key.
com.licel.jcardsim.card.applet.0.AID=01020304050607080102
com.licel.jcardsim.card.applet.0.Class=com.impala.applet.ImpalaApplet
impala.platform=jc32
# Other JavaCard 3.2 cards. Ed25519 only under the 3.2 constant (still a
# Stellar key):
#impala.platform=jc32-per-curve
# No EdDSA at all: the native CAP gives a legacy card (steps 19 and 20 answer
# 0109 and 623C):
#impala.platform=jc32-no-eddsa
# The default CAP on the same hardware (the software engine works at any level):
#impala.ed25519=soft
