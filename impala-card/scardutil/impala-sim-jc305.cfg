# scardutil simulator target: an Impala card on JavaCard 3.0.5 hardware.
# The same keys as impala-sim.cfg; see there and README.md.
#
# The card is the default CAP (ImpalaApplet.cap, the software Ed25519 engine)
# on a JavaCard 3.0.5 card that has everything the engine asks for: ECDH that
# returns both coordinates, custom curve parameters, SHA-512, AES-256 keys. It
# has no EdDSA API. The dispatch sequence passes on it unchanged.
com.licel.jcardsim.card.applet.0.AID=01020304050607080102
com.licel.jcardsim.card.applet.0.Class=com.impala.applet.ImpalaApplet
impala.platform=jc305
# To see what the fleet records for a JavaCard 3.0.5 card whose OS cannot run
# the engine (steps 19 and 20 of the sequence answer 0109 and 623C: a legacy
# card), name one of the lesser cards instead:
#impala.platform=jc305-no-xy
#impala.platform=jc305-fixed-curves
#impala.platform=jc305-wrong-curve-math
#impala.platform=jc305-no-sha512
#impala.platform=jc305-small-ram
