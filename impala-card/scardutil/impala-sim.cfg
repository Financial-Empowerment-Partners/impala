# jcardsim-style cfg for scardutil's simulator target (scripts/vpcd-sim.sh).
# scardutil appends the vpcd host/port keys in managed mode; for attached mode
# add com.licel.jcardsim.vsmartcard.host / .port yourself.
com.licel.jcardsim.card.applet.0.AID=01020304050607080102
com.licel.jcardsim.card.applet.0.Class=com.impala.applet.ImpalaApplet
# Optional (ours): install-parameter TLV, e.g. 0101 = ENFORCE. Leave unset for
# the plain install the dispatch sequence expects.
#impala.install.params=0101
# Optional (ours): the Ed25519 engine of the simulated card, as the CAP variant
# of -Papplet.ed25519 would have it: soft (the default CAP), native or none.
#impala.ed25519=soft
# Optional (ours): the simulated hardware, a card model of the simulator
# (README.md here lists them): jc305 (a JavaCard 3.0.5 card), jc32 (a JavaCard
# 3.2 card), jc32-per-curve, jc305-no-xy, ... With it and without
# impala.ed25519 the card gets the CAP an operator would load on that
# hardware (soft on jc305, native on jc32). Unset: the default CAP on a
# JavaCard 3.0.5 card. impala-sim-jc305.cfg and impala-sim-jc32.cfg are this
# file with the key set.
#impala.platform=jc305
