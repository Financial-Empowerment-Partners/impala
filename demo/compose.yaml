# demo/: the Impala bridge stack on Stellar testnet, for Docker Compose v2 and Podman from one file.
# Written to the compose-v2 / podman-compose feature intersection: fully qualified images, quoted
# environment values, exec-form healthchecks, no container_name/hostname/links/expose, network aliases
# only, images pre-built by scripts/build.sh (`up --no-build`). Values come from ./.env (scripts/prepare.sh).
#
# Lifecycle is driven by scripts/up.sh in phases (it never relies on depends_on conditions being honoured
# by the compose provider): databases → openbao-init → impala-migrate (one-shot RUN_MODE=migrate, the
# operator-run migration step of a real deployment) → impala-bridge → impala-ui; the Payala stub starts with the databases.
name: impala-suite

# Everything the bridge binary reads, shared by the server and the one-shot migrate run.
x-bridge-env: &bridge-env
  DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/impala"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  JWT_SECRET: "${JWT_SECRET}"
  STELLAR_NETWORK: "testnet"
  # plain-HTTP local stack; no proxy in front of the bridge
  SESSION_COOKIE_SECURE: "false"
  TRUSTED_PROXY_HOPS: "0"
  # lets POST /authenticate set the first password on the seeded accounts (demo only; never on a real deployment)
  ALLOW_OPEN_REGISTRATION: "true"
  # lets the admin provision custodial seeds and the card program issuer key through the API
  KEY_IMPORT_ENABLED: "true"
  ADMIN_ACCOUNT_IDS: "${PAYALA_ADMIN_ID}"
  CORS_ALLOWED_ORIGINS: "http://localhost:${UI_PORT}"
  SEED_PROTECTION_BACKEND: "openbao"
  BAO_ADDR: "http://openbao:8200"
  BAO_TOKEN: "${BAO_DEV_ROOT_TOKEN_ID}"
  BAO_TRANSIT_KEY: "impala-seeds"
  # OIDC test IdP config generated by openbao-init (the client_id is minted at bootstrap)
  CONFIG_FILE: "/bootstrap/sso-config.json"
  # without an OTLP endpoint the bridge logs to syslog, i.e. nothing readable in a container
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  OTEL_SERVICE_NAME: "impala-bridge"
  OTEL_ENVIRONMENT: "demo"

services:
  # ---------------------------------------------------------------- Impala bridge stack
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "impala"
    volumes:
      - impala-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: the unix socket also answers during initdb's temporary server; TCP does not
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "impala"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "unless-stopped"

  redis:
    image: docker.io/library/redis:7-alpine
    # the password is written to a config file at start so it never appears in the process argv
    command: ["sh", "-c", "printf 'requirepass %s\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "unless-stopped"

  # OpenBao dev server (in-memory, auto-unsealed): the bridge's seed-protection (Transit) backend and
  # the OIDC test IdP for the admin UI. LOCAL DEMO ONLY. Deliberately no restart policy: a restarted
  # dev server has a NEW transit key and every seed the bridge sealed becomes undecryptable -> scripts/reset.sh.
  openbao:
    image: docker.io/openbao/openbao:2.5.5
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: "${BAO_DEV_ROOT_TOKEN_ID}"
      BAO_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      BAO_ADDR: "http://127.0.0.1:8200"
    ports:
      # the browser talks to the OIDC provider directly during SSO login
      - "127.0.0.1:${OPENBAO_PORT}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"

  openbao-init:
    image: docker.io/openbao/openbao:2.5.5
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: "http://openbao:8200"
      BAO_TOKEN: "${BAO_DEV_ROOT_TOKEN_ID}"
      UI_ORIGIN: "http://localhost:${UI_PORT}"
      OPENBAO_PUBLIC_URL: "http://localhost:${OPENBAO_PORT}"
    volumes:
      - ./config/openbao/openbao-init.sh:/scripts/openbao-init.sh:ro
      - openbao-bootstrap:/bootstrap
    # rootless podman on SELinux-enforcing hosts (Fedora/RHEL): bind-mounted host files are user_home_t
    # and unreadable by a confined container without this. No-op on Docker and on podman machine (macOS).
    security_opt: ["label=disable"]
    entrypoint: ["/bin/sh"]
    command: ["/scripts/openbao-init.sh"]
    restart: "no"

  otel-collector:
    image: docker.io/otel/opentelemetry-collector:0.116.1
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    security_opt: ["label=disable"]
    restart: "unless-stopped"

  # One-shot: the operator-run migration step (RUN_MODE=migrate; sqlx records versions in
  # _sqlx_migrations). scripts/up.sh runs it with `compose run --rm --no-deps` before starting the bridge,
  # so a new migration in the repo is applied on the next build + up without a volume reset.
  impala-migrate:
    image: localhost/impala-suite/impala-bridge:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    environment:
      <<: *bridge-env
      RUN_MODE: "migrate"
    volumes:
      - openbao-bootstrap:/bootstrap:ro
    restart: "no"

  impala-bridge:
    image: localhost/impala-suite/impala-bridge:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      <<: *bridge-env
    ports:
      - "127.0.0.1:${BRIDGE_PORT}:8080"
    volumes:
      - openbao-bootstrap:/bootstrap:ro
    healthcheck:
      # /readyz is 200 only when Postgres and Redis answer (the image's own HEALTHCHECK is dropped by OCI-format podman builds)
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      default:
        # impala-ui's nginx resolves all three upstream names at startup
        aliases:
          - testnet-bridge
          - mainnet-bridge
    # the bridge drains in-flight requests for up to 55 s on SIGTERM
    stop_grace_period: 60s
    restart: "unless-stopped"

  impala-ui:
    image: docker.io/library/nginx:1.30-alpine
    depends_on:
      impala-bridge:
        condition: service_started
    ports:
      - "127.0.0.1:${UI_PORT}:80"
    volumes:
      - ./build/impala-ui/html:/usr/share/nginx/html:ro
      - ./build/impala-ui/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt: ["label=disable"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: "unless-stopped"

  # ---------------------------------------------------------------- Payala stub (in-repo; the proprietary Payala API is not used)
  # payala-stub/server.mjs is a dependency-free Node stand-in for the Payala API subset the relays use (see
  # payala-stub/README.md). It runs straight from the public node image with the directory bind-mounted: no
  # image to build, no Payala source tree. The seed (ids + P-256 card keys) is rendered by scripts/prepare.sh;
  # the ledger persists in the payala-stub-data volume (cleared by scripts/reset.sh, like the bridge database).
  payala-stub:
    image: docker.io/library/node:22-alpine
    command: ["node", "/app/server.mjs"]
    environment:
      PAYALA_STUB_PORT: "4000"
      PAYALA_STUB_SEED: "/seed/seed.json"
      PAYALA_STUB_STATE: "/data/state.json"
    volumes:
      - ./payala-stub:/app:ro
      - ./build/payala-stub:/seed:ro
      - payala-stub-data:/data
    security_opt: ["label=disable"]
    ports:
      - "127.0.0.1:${PAYALA_PORT}:4000"
    healthcheck:
      # /__stub/healthz is not journaled, so the health pings do not crowd out the request journal scenario 08 reads
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/__stub/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "unless-stopped"

volumes:
  impala-pgdata: {}
  # written by openbao-init (sso-config.json), read by impala-migrate and impala-bridge
  openbao-bootstrap: {}
  payala-stub-data: {}
