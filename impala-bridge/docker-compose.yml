services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: impala
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    environment:
      # redis-cli reads REDISCLI_AUTH so the healthcheck works with AUTH enabled
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  impala-bridge:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The image already runs as a non-root user (UID 1000) with a HEALTHCHECK.
    # Production (ECS) runs it with a read-only root filesystem. To mirror that
    # locally, uncomment the following (a writable tmpfs is provided for scratch
    # space; the bridge logs to syslog/stdout, not the root fs):
    # read_only: true
    # tmpfs:
    #   - /tmp
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/impala
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-only-for-local-dev!!!}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      # Local stack is plain HTTP: Secure cookies would be dropped by browsers.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      OKTA_ISSUER_URL: ${OKTA_ISSUER_URL:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_AUTH_ENABLED: ${GITHUB_AUTH_ENABLED:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

# impala-ui joins this network externally by name — keep it stable even if the
# directory (and thus the compose project name) is ever renamed.
networks:
  default:
    name: impala-bridge_default
