services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: impala
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OpenBao (OSS, API-compatible HashiCorp Vault fork) in dev mode: auto-initialized
  # and unsealed, in-memory storage, no TLS. LOCAL DEVELOPMENT ONLY — the root token
  # is well-known and all data is ephemeral. Used here as the seed-protection
  # (Transit) backend for impala-bridge so the custodial /managed-account/* endpoints
  # work locally without AWS KMS.
  openbao:
    image: openbao/openbao:2.5.5
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # So the in-container `bao` CLI (healthcheck) can reach the dev server over HTTP.
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: enable the Transit engine and create the seed key (idempotent).
  openbao-init:
    image: openbao/openbao:2.5.5
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        bao secrets enable transit 2>/dev/null || true
        bao write -f transit/keys/impala-seeds
    restart: "no"

  impala-bridge:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/impala
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-only-for-local-dev!!!}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      OKTA_ISSUER_URL: ${OKTA_ISSUER_URL:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      # Custodial seed protection via the local OpenBao Transit engine.
      # Override SEED_PROTECTION_BACKEND=none to run without a secrets backend.
      SEED_PROTECTION_BACKEND: ${SEED_PROTECTION_BACKEND:-openbao}
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      BAO_TRANSIT_KEY: impala-seeds
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

volumes:
  pgdata:
