services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: impala
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    environment:
      # redis-cli reads REDISCLI_AUTH so the healthcheck works with AUTH enabled
      REDISCLI_AUTH: ${REDIS_PASSWORD:-password}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OpenBao (OSS, API-compatible HashiCorp Vault fork) in dev mode: auto-initialized
  # and unsealed, in-memory storage, no TLS. LOCAL DEVELOPMENT ONLY — the root token
  # is well-known and all data is ephemeral. Used here as the seed-protection
  # (Transit) backend for impala-bridge so the custodial /managed-account/* endpoints
  # work locally without AWS KMS.
  openbao:
    image: openbao/openbao:2.5.5
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # So the in-container `bao` CLI (healthcheck) can reach the dev server over HTTP.
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: enable the Transit engine and create the seed key, then
  # bootstrap OpenBao as a local OIDC test IdP for admin-UI SSO (idempotent).
  openbao-init:
    image: openbao/openbao:2.5.5
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
    volumes:
      - openbao-bootstrap:/bootstrap
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        bao secrets enable transit 2>/dev/null || true
        bao write -f transit/keys/impala-seeds

        # ── OIDC test IdP (LOCAL DEVELOPMENT ONLY) ──────────────────────────
        # Makes OpenBao a full OIDC provider so the admin UI's SSO flow runs
        # without a real Okta/Auth0 org. Login: testuser / testpassword.

        # The browser POSTs the PKCE code exchange to OpenBao's token endpoint
        # from http://localhost:3000 — OpenBao must send CORS headers.
        bao write sys/config/cors enabled=true allowed_origins="http://localhost:3000"

        bao auth enable userpass 2>/dev/null || true
        bao write auth/userpass/users/testuser password="testpassword"

        # Identity entity carrying the email claim, aliased to the userpass
        # user. Entity/alias creation is not create-or-update, hence || true
        # with a read-back of the generated ids.
        bao write identity/entity name="testuser" metadata=email="testuser@example.com" >/dev/null 2>&1 || true
        ENTITY_ID=$$(bao read -field=id identity/entity/name/testuser)
        UP_ACCESSOR=$$(bao read -field=accessor sys/auth/userpass)
        bao write identity/entity-alias name="testuser" canonical_id="$$ENTITY_ID" mount_accessor="$$UP_ACCESSOR" >/dev/null 2>&1 || true

        # Explicit assignment: only listed entities may authorize (allow_all
        # would let any future OpenBao identity mint bridge accounts).
        bao write identity/oidc/assignment/impala-admins entity_ids="$$ENTITY_ID"

        # Scope templates for the claims the bridge reads (oidc::OidcTokenClaims).
        bao write identity/oidc/scope/email description="email claim" template='{"email": {{identity.entity.metadata.email}}}'
        bao write identity/oidc/scope/profile description="profile claims" template='{"preferred_username": {{identity.entity.name}}}'

        # Public PKCE client (no secret; S256 mandatory). client_id is
        # GENERATED by OpenBao — read it back for the bridge config below.
        bao write identity/oidc/client/impala-admin-ui \
          redirect_uris="http://localhost:3000/sso-callback.html" \
          assignments="impala-admins" client_type="public" \
          id_token_ttl="30m" access_token_ttl="1h"
        CLIENT_ID=$$(bao read -field=client_id identity/oidc/client/impala-admin-ui)

        # Provider: issuer must be the BROWSER-reachable base (scheme://host:port);
        # OpenBao derives {issuer}/v1/identity/oidc/provider/openbao from it.
        bao write identity/oidc/provider/openbao \
          issuer="http://localhost:8200" \
          allowed_client_ids="$$CLIENT_ID" \
          scopes_supported="email,profile"

        # Hand the generated client_id + provider config to the bridge via its
        # JSON CONFIG_FILE (all values must be JSON *strings* — the bridge's
        # config loader reads file values with as_str).
        cat > /bootstrap/sso-config.json <<EOF
        {
          "sso_providers": "openbao",
          "openbao_issuer_url": "http://localhost:8200/v1/identity/oidc/provider/openbao",
          "openbao_internal_issuer_url": "http://openbao:8200/v1/identity/oidc/provider/openbao",
          "openbao_client_id": "$$CLIENT_ID",
          "openbao_token_kind": "id",
          "openbao_allow_http": "true"
        }
        EOF
        chmod 644 /bootstrap/sso-config.json
        echo "OIDC test IdP ready (client_id $$CLIENT_ID)"
    restart: "no"

  impala-bridge:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    # The image already runs as a non-root user (UID 1000) with a HEALTHCHECK.
    # Production (ECS) runs it with a read-only root filesystem. To mirror that
    # locally, uncomment the following (a writable tmpfs is provided for scratch
    # space; the bridge logs to syslog/stdout, not the root fs):
    # read_only: true
    # tmpfs:
    #   - /tmp
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/impala
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-is-only-for-local-dev!!!}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      # Local stack is plain HTTP: Secure cookies would be dropped by browsers.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      OKTA_ISSUER_URL: ${OKTA_ISSUER_URL:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GITHUB_AUTH_ENABLED: ${GITHUB_AUTH_ENABLED:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Custodial seed protection via the local OpenBao Transit engine.
      # Override SEED_PROTECTION_BACKEND=none to run without a secrets backend.
      SEED_PROTECTION_BACKEND: ${SEED_PROTECTION_BACKEND:-openbao}
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: ${BAO_DEV_ROOT_TOKEN_ID:-dev-root-token}
      BAO_TRANSIT_KEY: impala-seeds
      # OIDC test IdP config generated by openbao-init (the client_id is
      # minted at bootstrap, so it can't live in this file). Do NOT add
      # SSO_PROVIDERS/OPENBAO_* env entries with empty defaults here — a
      # set-but-empty env var shadows the corresponding CONFIG_FILE value.
      CONFIG_FILE: /bootstrap/sso-config.json
    volumes:
      - openbao-bootstrap:/bootstrap:ro
    networks:
      default:
        # impala-ui's nginx resolves its per-network upstreams at startup, so
        # both names must exist locally; the single local bridge serves them
        # all (STELLAR_NETWORK selects which Stellar network it talks to).
        aliases:
          - testnet-bridge
          - mainnet-bridge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  # Written by openbao-init (sso-config.json), read by impala-bridge.
  openbao-bootstrap:

# impala-ui joins this network externally by name — keep it stable even if the
# directory (and thus the compose project name) is ever renamed.
networks:
  default:
    name: impala-bridge_default
