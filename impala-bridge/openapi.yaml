openapi: 3.1.0
info:
  title: impala-bridge
  version: "0.0.0"
  summary: REST bridge between offline Payala payments and the Stellar network.
  description: |
    impala-bridge issues JWTs, persists dual-chain transactions, dispatches
    notifications via SMS/email/push/webhook, and streams events from Stellar
    Horizon and Payala.

    Authentication uses a two-token strategy:

    - **Refresh token** (14-day TTL) — obtained via username+password from `POST /token`.
      Used only to mint temporal tokens, never for API access.
    - **Temporal token** (1-hour TTL) — obtained from a refresh token via `POST /token`.
      Sent as `Authorization: Bearer <token>` on every authenticated request.

    All mutating endpoints enforce account ownership via `require_owner`. A
    `POST /logout` revokes the current token (the JTI is added to a Redis
    blacklist until it would have expired naturally).

    Rate limits apply to `/authenticate`, `/token`, `/mfa/verify`, `/transaction`,
    and `/card`: 10 requests per 60-second window, keyed by account id (and
    MFA type where applicable). Exceeding the limit returns HTTP 429 with a
    `Retry-After` header.

    Global request timeout is 30 s (HTTP 408 on exceed). Postgres has a
    per-connection `statement_timeout` of 60 s.
  contact:
    name: impala-bridge maintainers
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8080
    description: Local development (`docker compose up` inside `impala-bridge/`).
  - url: https://{host}
    description: Production / staging behind ALB.
    variables:
      host:
        default: bridge.example.com

tags:
  - name: health
    description: Liveness, readiness, build and Stellar-network info.
  - name: auth
    description: >
      Registration, credential verification, token issue/revoke, cookie
      sessions, and federated login (Okta, Google, GitHub, SSO/OIDC, card).
  - name: account
    description: Account CRUD.
  - name: admin
    description: >
      Privileged cross-account management. Listing accounts needs the
      ReadAccounts capability (admin, auditor, or key-custodian);
      delete/role/profile-sync remain admin-only.
  - name: reserve
    description: >
      Conversion reserve — a bridge-owned pool that fulfills exchange orders
      under a per-provider threshold ($20-$200) instead of routing them to the
      external provider. Reads need the ReadReserve capability (admin,
      treasurer, or auditor); mutations need ManageReserve (admin or
      treasurer).
  - name: managed-account
    description: Custodial Stellar accounts — server-side seed generation/import and sign+submit.
  - name: keys
    description: >
      Privileged import of the credentials the bridge uses to move money
      (mutations: admin or key-custodian, the ManageKeys capability; listing
      additionally: auditor, ReadKeys) — provider
      API/signing keys and custodial Stellar seeds. DANGER: a provider
      credential is spend authority over the replenishment leg's outgoing
      treasury XLM, and a seed is signing authority. Imports ADD by default;
      replacing anything already in effect needs an explicit compare-and-swap
      plus a typed confirmation phrase, and takes effect only at the next
      rolling restart. Off unless KEY_IMPORT_ENABLED=true. See
      docs/runbooks/import-keys.md.
  - name: mfa
    description: TOTP and SMS enrollment + verification.
  - name: card
    description: Hardware smartcard registration.
  - name: transaction
    description: Dual-chain (Stellar + Payala) transaction records.
  - name: subscription
    description: Notification subscriptions and stream subscribe triggers.
  - name: notify
    description: Notification destinations (phone, email, webhook).
  - name: device
    description: FCM device-token registration for mobile push.
  - name: webhook
    description: >
      Outbound webhook registration (admin-only) and the admin event feed
      (readable with the ReadEvents capability: admin or auditor).
  - name: exchange
    description: >
      Fiat<->USDC on/off-ramp (OwlPay Harbor, Changelly Fiat) and crypto->USDC
      swaps (Changelly Exchange API v2), plus the provider webhook callbacks.

security:
  - bearerAuth: []

paths:
  /:
    get:
      tags: [health]
      summary: Root greeting.
      security: []
      responses:
        '200':
          description: Static greeting.
          content:
            text/plain:
              schema: { type: string }

  /health:
    get:
      tags: [health]
      summary: Detailed health (DB + Redis + network).
      security: []
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /healthz:
    get:
      tags: [health]
      summary: Liveness probe.
      security: []
      responses:
        '200': { description: Process alive. }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe. 200 if DB and Redis are reachable, else 503.
      security: []
      responses:
        '200': { description: Ready to accept traffic. }
        '503': { description: A dependency is unhealthy. }

  /version:
    get:
      tags: [health]
      summary: Build and schema version info.
      security: []
      responses:
        '200':
          description: Build info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionResponse' }

  /network:
    get:
      tags: [health]
      summary: Stellar network configuration the bridge is wired to.
      security: []
      responses:
        '200':
          description: Stellar network info.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NetworkInfoResponse' }

  /authenticate:
    post:
      tags: [auth]
      summary: Register or verify a user with username+password.
      description: |
        If no credentials exist for the account, registers the user with the
        supplied password (Argon2 hashed). If credentials exist, verifies the
        password. Returns a generic "Invalid credentials" for both missing
        accounts and wrong passwords (account-enumeration defense). Rate
        limited; lockout after 5 failed attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthenticateRequest' }
      responses:
        '200':
          description: Authentication outcome (success may be false with 200).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthenticateResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /token:
    post:
      tags: [auth]
      summary: Mint or refresh JWTs.
      description: |
        Two flows. If `refresh_token` is supplied, returns a new refresh +
        temporal pair and revokes the presented refresh token. Otherwise the
        request must include `username`+`password` and returns only a refresh
        token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Token pair (or single refresh token for password flow).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Invalid or revoked refresh token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /logout:
    post:
      tags: [auth]
      summary: Revoke the current temporal or refresh token.
      description: |
        Accepts either token type as the bearer credential and adds its JTI to
        the Redis revocation blacklist for the token's remaining lifetime.
      responses:
        '200':
          description: Token revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /logout/all:
    post:
      tags: [auth]
      summary: Revoke every token and session for the account.
      description: |
        Bumps the account's auth epoch so every refresh/temporal token and
        session issued at or before now is rejected. Works from the bearer or
        the cookie path; on the cookie path the current session is also deleted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: All tokens and sessions revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /session/login:
    post:
      tags: [auth]
      summary: Establish a browser cookie session from local credentials.
      description: |
        Same credential check and rate-limit/lockout regime as `POST /token`
        (password flow). On success sets an HttpOnly session cookie and returns
        a CSRF synchronizer token to send as `X-CSRF-Token` on later
        unsafe-method cookie requests.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionLoginRequest' }
      responses:
        '200':
          description: Session established (also sets a `Set-Cookie` header).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /session/me:
    get:
      tags: [auth]
      summary: Current cookie-session identity and CSRF token.
      description: Requires a valid session cookie. Re-derives `is_admin` from the live allowlist.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Active session identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /session/logout:
    post:
      tags: [auth]
      summary: Destroy the current cookie session.
      description: Requires a valid session cookie; CSRF is enforced. Clears the session cookie.
      security:
        - cookieAuth: []
      responses:
        '200': { description: Session destroyed (also clears the session cookie). }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/okta:
    post:
      tags: [auth]
      summary: Exchange an Okta access token for bridge tokens (legacy single-provider flow).
      description: |
        Validates the Okta access token, auto-provisions the account on first
        login, and issues a refresh + temporal token pair. With
        `cookie_mode: true` (used by the web UI) it instead establishes an
        HttpOnly cookie session and returns a `SessionResponse`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OktaTokenExchangeRequest' }
      responses:
        '200':
          description: Bridge tokens (bearer mode) or session identity (cookie mode).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - $ref: '#/components/schemas/SessionResponse'
        '400': { description: Okta authentication is not configured. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/okta/config:
    get:
      tags: [auth]
      summary: Okta client configuration for the UI.
      security: []
      responses:
        '200':
          description: Okta config; returns enabled=false when not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OktaConfigResponse' }

  /auth/google:
    post:
      tags: [auth]
      summary: Exchange a Google ID token for bridge tokens.
      description: |
        Validates the Google ID token (RS256, issuer, audience = Google client
        id, expiry), auto-provisions the account (verified email, else
        `google:{sub}`), and issues a refresh + temporal token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleTokenExchangeRequest' }
      responses:
        '200':
          description: Bridge refresh + temporal tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { description: Google authentication is not configured. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/google/config:
    get:
      tags: [auth]
      summary: Google client configuration for the UI.
      security: []
      responses:
        '200':
          description: Google config; returns enabled=false when not configured.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleConfigResponse' }

  /auth/github:
    post:
      tags: [auth]
      summary: Exchange a GitHub OAuth code or access token for bridge tokens.
      description: |
        Supply `code` (+ optional `redirect_uri`) for the server-side
        code→token exchange, or a legacy `access_token`. The token is verified
        against `GET {GITHUB_API_URL}/user`; the account id is `github:{id}`,
        auto-provisioned on first login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTokenExchangeRequest' }
      responses:
        '200':
          description: Bridge tokens plus the GitHub login/display name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubExchangeResponse' }
        '400': { description: GitHub not configured, or neither code nor access_token supplied. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/card/challenge:
    post:
      tags: [auth]
      summary: Issue a single-use card-signing challenge.
      description: |
        Returns a random 32-byte challenge (hex) the card signs. Issued
        unconditionally (no card lookup) so the response never reveals whether a
        card is registered. Stored in Redis with a 60 s TTL, consumed by
        `POST /auth/card`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardChallengeRequest' }
      responses:
        '200':
          description: Challenge issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardChallengeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/card:
    post:
      tags: [auth]
      summary: Exchange a card signature for bridge tokens.
      description: |
        Consumes the outstanding challenge (single-use) and verifies the
        ECDSA-SHA256 signature against the registered card's EC public key. All
        failure modes return a generic 401 and count toward a per-card lockout.
        No auto-provisioning — a registered card implies an existing account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardTokenExchangeRequest' }
      responses:
        '200':
          description: Bridge refresh + temporal tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sso/{provider}:
    post:
      tags: [auth]
      summary: Exchange a validated OIDC token for bridge tokens.
      description: >
        Exchange a token from the named SSO provider (okta | auth0 | duo |
        openbao | …) for the bridge's refresh + temporal JWT pair.
        Auto-provisions the account on first login. Send `token` (the OIDC
        access token; `okta_token` is accepted as a legacy alias) for
        access-token providers, or `id_token` for providers configured with
        token_kind=id (e.g. Duo SSO, the local OpenBao test IdP).
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          description: Provider name (okta | auth0 | duo | openbao).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, description: 'OIDC access token (legacy alias: okta_token).' }
                id_token: { type: string, description: 'OIDC id token (token_kind=id providers, e.g. Duo SSO or OpenBao).' }
      responses:
        '200':
          description: Bridge refresh + temporal tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { description: Provider not configured, or no token supplied. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sso/{provider}/config:
    get:
      tags: [auth]
      summary: Return client-side OIDC configuration for a provider.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          description: Provider name (okta | auth0 | duo | openbao).
      responses:
        '200':
          description: >
            OIDC config for the UI — { enabled, provider, issuer, client_id,
            audience, authorization_endpoint, token_endpoint, scopes }. Returns
            { enabled: false } when the provider is not configured.

  /auth/providers:
    get:
      tags: [auth]
      summary: List the names of all configured SSO providers.
      security: []
      responses:
        '200':
          description: JSON array of configured provider names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /account:
    post:
      tags: [account]
      summary: Create an account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        '200':
          description: Account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateAccountResponse' }
    get:
      tags: [account]
      summary: Get account details (owner-scoped; admins may read any account).
      parameters:
        - in: query
          name: stellar_account_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [account]
      summary: Update the authenticated user's account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccountRequest' }
      responses:
        '200':
          description: Account updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /account/onchain:
    get:
      tags: [account]
      summary: Live on-chain account details from this bridge's network (owner or admin).
      parameters:
        - in: query
          name: stellar_account_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: On-chain account state (exists=false when unfunded).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnchainAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /accounts:
    get:
      tags: [admin]
      summary: List all accounts (admin, auditor, or key-custodian — the ReadAccounts capability).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Paginated account list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAccountList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/accounts/{account_id}:
    delete:
      tags: [admin]
      summary: Delete an account (admin only). Blocks self/last-admin delete.
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{account_id}/role:
    put:
      tags: [admin]
      summary: Set an account's role (admin only). Blocks last-admin demotion.
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleRequest' }
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetRoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{account_id}/sync-profile:
    post:
      tags: [admin]
      summary: Force a directory re-pull for the account's profile source (admin only).
      description: |
        For `ldap`-sourced accounts, re-pulls name/affiliation from the directory
        and writes them back. `okta` and `local` sources return 400 (no live
        server-side re-pull is available).
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Profile synced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/accounts/{account_id}/sync-mode:
    put:
      tags: [admin]
      summary: Set an account's Payala sync mode (admin only).
      description: |
        Flips are forward-only: existing reserve balances and mirrored rows are
        untouched, and only future batches follow the new mode. Leaving
        `reserve` while a nonzero reserve balance remains returns 409 unless
        `force: true` is passed.
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSyncModeRequest' }
      responses:
        '200':
          description: Sync mode updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetSyncModeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/webhooks:
    post:
      tags: [webhook]
      summary: Register an outbound admin webhook (admin only).
      description: |
        Registers a callback URL for the event feed. The URL is SSRF-validated
        at registration (and again on every delivery). A 256-bit HMAC-SHA256
        signing secret is generated and returned **once**. Rate limited per admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWebhookRequest' }
      responses:
        '200':
          description: Webhook registered (secret returned once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterWebhookResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [webhook]
      summary: List registered admin webhooks (admin or auditor). Never returns the signing secret.
      responses:
        '200':
          description: Webhook list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/webhooks/{id}:
    delete:
      tags: [webhook]
      summary: Delete an admin webhook (admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Webhook deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/webhooks/{id}/test:
    post:
      tags: [webhook]
      summary: Enqueue a signed test event to a webhook (admin only).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Test event enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  event_id: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/events:
    get:
      tags: [webhook]
      summary: Pull/replay the admin event feed (admin or auditor).
      parameters:
        - in: query
          name: since
          schema: { type: integer, format: int64, default: 0 }
          description: Return events with id strictly greater than this cursor.
        - in: query
          name: limit
          schema: { type: integer, format: int64, default: 100 }
          description: Max events to return (clamped to 1..500).
      responses:
        '200':
          description: Event feed page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventFeedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/keys:
    get:
      tags: [keys]
      summary: List provider credentials — running, stored, and the gap (admin, key-custodian, or auditor).
      description: |
        For each credential kind: what THIS instance resolved at startup
        (`effective_source`, `effective_fingerprint`), what is stored in the
        database, and `pending_restart` when they differ — the normal state
        between an import and the deploy that activates it.

        Never returns key material. Fingerprints are one-way digests over
        canonical parsed material; RSA keys are fingerprinted through their
        PUBLIC half, so no digest of private material exists. `env_vars_set`
        names environment variables still present, which a stored credential is
        shadowing: until they are removed, turning `KEY_IMPORT_ENABLED` off
        reverts to them.

        Readable even when the feature is disabled, so stored-but-inert rows
        are visible rather than hidden.
      responses:
        '200':
          description: Credential inventory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/keys/{kind}:
    post:
      tags: [keys]
      summary: Import (or, with confirmation, replace) a provider credential set (admin or key-custodian).
      description: |
        **This installs a credential that moves money.** The replenishment
        driver sends real reserve XLM to the pay-in address the active
        Changelly account names, so whoever controls this credential chooses a
        counterparty the bridge pays.

        **Adds only, by default.** If any credential is already in effect for
        this kind — including one supplied by the environment — the request is
        refused with `409` and a descriptor of what is there. To replace it,
        resend with `replace: true`, `expected_fingerprint` equal to the
        fingerprint currently in effect, and `confirm_phrase` equal to
        `replace {kind} {network}`.

        The fingerprint is a compare-and-swap token: it stops two admins
        clobbering each other and stops a blind replace of something never
        looked at. It is NOT access control — an admin can read it from
        `GET /admin/keys`.

        The set is validated, then proven against the provider with one
        authenticated read-only call (`skip_verify` opts out, and is audited).
        OwlPay exposes no such endpoint, so its credentials are validated but
        not proven; the response says so.

        **Nothing changes until a rolling restart.** Credentials are resolved
        once per process so every instance switches together instead of
        drifting apart.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [owlpay, changelly_crypto, changelly_fiat] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportKeyRequest' }
      responses:
        '200':
          description: Credential stored (replacing the previous version).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyActionResponse' }
        '400':
          description: >
            Unknown kind or part, a key that does not parse, a note that looks
            like key material, or a credential the provider rejected.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Not an admin, or KEY_IMPORT_ENABLED is false.
        '409':
          description: >
            A credential is already in effect and `replace` was not set; or
            `expected_fingerprint` / `confirm_phrase` did not match; or
            non-terminal orders would be stranded by the change.
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/keys/{kind}/merge:
    post:
      tags: [keys]
      summary: Rotate part of a stored credential set (admin or key-custodian).
      description: |
        Overlays `set_parts` onto the stored set and removes `drop_parts`,
        writing a new version. Exists because a stored secret cannot be read
        back, so rotating one part (Changelly rotates its callback public key
        on its own schedule) would otherwise mean re-entering the others.

        Only works against a STORED set — there is nothing to merge into an
        environment-sourced credential, and synthesising one would silently
        promote the deployment's secrets into the database. Always a
        replacement, so it always requires the confirmation fields.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [owlpay, changelly_crypto, changelly_fiat] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeKeyRequest' }
      responses:
        '200':
          description: Merged credential stored as a new version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyActionResponse' }
        '400': { description: Nothing to change, or an unknown/undroppable part. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not an admin, or KEY_IMPORT_ENABLED is false. }
        '404': { description: No stored credential for this kind to merge into. }
        '409': { description: Confirmation missing or stale. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/keys/{kind}/revoke:
    post:
      tags: [keys]
      summary: Revoke a stored credential and scrub its ciphertext (admin or key-custodian).
      description: |
        Marks the stored credential revoked and clears its ciphertext
        immediately — unlike supersession, which keeps the previous version
        decryptable for a bounded overlap so in-flight webhooks still verify.

        Revoking here does NOT invalidate the key at the provider. If it is
        believed compromised, revoke it there first.

        Because revocation changes what the provider falls back to after the
        next restart — the environment credential, or nothing at all — the
        request must acknowledge that outcome with `confirm_next_source`. The
        409 body names it.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [owlpay, changelly_crypto, changelly_fiat] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeKeyRequest' }
      responses:
        '200':
          description: Credential revoked and scrubbed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyActionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not an admin, or KEY_IMPORT_ENABLED is false. }
        '409':
          description: >
            Confirmation missing, fingerprint stale, or the resulting fallback
            source not acknowledged.
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/stellar-seeds/generate:
    post:
      tags: [keys]
      summary: Provision a bridge-generated custodial Stellar seed (admin or key-custodian).
      description: |
        Creates the seed inside the bridge, seals it with the configured
        protection backend, and returns only the public `G...` address. The
        secret never exists outside the process in plaintext and there is no
        way to export it.

        **This is the only way to provision the conversion-reserve account's
        seed.** Import is refused for that account: an admin-supplied reserve
        seed means a human holds the pool's signing key indefinitely, and
        during bootstrap it would let whoever calls first install a key they
        control and capture every deposit the bridge later directs at the
        reserve address.

        Add-only: an account that already has a seed is refused rather than
        having its existing one orphaned. Fund the returned address before it
        can transact; if it is `RESERVE_ACCOUNT_ID`, restart to activate the
        conversion reserve.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSeedRequest' }
      responses:
        '200':
          description: Seed generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSeedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not an admin, or KEY_IMPORT_ENABLED is false. }
        '409': { description: The account already has a custodial seed. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/stellar-seeds/import:
    post:
      tags: [keys]
      summary: Bring an existing Stellar secret seed under custody (admin or key-custodian).
      description: |
        Binds an existing `S...` seed to an existing account. Refused for the
        configured reserve account (see `/admin/stellar-seeds/generate`).

        **A replacement may not change the account's Stellar address.** On this
        bridge an account's address IS its seed's public key — the signer
        derives the source account from the seed — so a different seed is a
        different account: the bridge would advertise one address for deposits
        while signing as another, and anything held at the old address would be
        stranded. Rotating a Stellar key without changing the address is an
        on-chain `set_options` operation this custodial signer does not
        support; create a new account and migrate instead.

        The account is looked up on Horizon first. A master key with weight 0
        is refused (`skip_verify` opts out): it can authorize nothing, however
        valid the strkey looks. An account that does not exist yet is fine —
        it simply has not been funded.

        The imported key also exists wherever it was copied from. Treat that
        copy as part of the bridge's key material.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminImportSeedRequest' }
      responses:
        '200':
          description: Seed stored. Signing uses it immediately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSeedResponse' }
        '400': { description: Malformed seed, or a key that cannot authorize on chain. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            Not an admin, KEY_IMPORT_ENABLED is false, or the target is the
            conversion-reserve account (generate-only).
        '404': { description: No such account. }
        '409':
          description: >
            A seed already exists and `replace` was not set, confirmation was
            missing or stale, or the new seed derives a different address.
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve:
    get:
      tags: [reserve]
      summary: Reserve status — buckets, policies, pending queues (admin, treasurer, or auditor).
      description: |
        Per-currency buckets carry `available`/`held`/`low_water` in BIGINT
        minor units (USDC/XLM 7 dp, USD cents) plus a best-effort live
        on-chain balance so ledger-vs-chain drift is visible. `pending`
        counts the admin work queues (on_hold payouts, fiat disbursements).
      responses:
        '200':
          description: Reserve status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReserveStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/policies/{provider}:
    put:
      tags: [reserve]
      summary: Set a provider's reserve routing policy (admin or treasurer).
      description: |
        `threshold_usd_cents` is DB-validated against [2000, 20000] — the
        "$20 to $200 as appropriate for the service" band. Only providers
        with a buildable fulfillment path accept a policy: `changelly_crypto`
        (automatic on-chain USDC payout) and `owlpay` (USDC pay-in + admin
        fiat disbursement queue); `changelly_fiat` is refused because its
        orders carry no payout coordinates the bridge could serve.
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [changelly_crypto, owlpay] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservePolicyUpdateRequest' }
      responses:
        '200': { description: Policy updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/buckets/{currency}:
    put:
      tags: [reserve]
      summary: Set a bucket's low-water alert mark (admin or treasurer).
      parameters:
        - in: path
          name: currency
          required: true
          schema: { type: string, example: USDC }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                low_water_minor: { type: integer, format: int64, minimum: 0 }
              required: [low_water_minor]
      responses:
        '200': { description: Bucket updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exchange-reserve/entries:
    post:
      tags: [reserve]
      summary: Record a manual ledger entry (admin or treasurer; rate limited 5/60s).
      description: |
        `topup`/`withdrawal` (positive magnitude) and signed `adjustment`
        move `available`; `held_adjustment` repairs `held` drift. Record a
        topup only AFTER the matching on-chain or bank funding actually
        happened — the ledger tracks real value. Withdrawals and negative
        adjustments are refused (409) rather than overdrawing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveEntryRequest' }
      responses:
        '200': { description: Entry recorded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Unknown bucket, or the operation would overdraw it. }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [reserve]
      summary: Paginated reserve journal (admin, treasurer, or auditor).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: currency
          schema: { type: string }
        - in: query
          name: kind
          schema:
            type: string
            enum: [hold, hold_release, deposit, unmatched_deposit, payout_attempt,
                   fulfillment, disbursement, topup, withdrawal, adjustment, held_adjustment]
      responses:
        '200':
          description: Journal page (newest first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReserveEntryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/unmatched:
    get:
      tags: [reserve]
      summary: Stray inflows to the reserve account (work queue; admin, treasurer, or auditor).
      description: |
        Deposits that could not be credited to an order — late (after
        expiry), underpaid, wrong asset, or unknown memo. Known assets are
        credited to reserve inventory (`unmatched_deposit` journal entries)
        so the ledger still tracks the chain; disposition (refund/absorb) is
        an ops decision per the runbook.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Unmatched inflow page (newest first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReserveUnmatchedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/refunds:
    get:
      tags: [reserve]
      summary: Refund queue (admin, treasurer, or auditor).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema:
            type: string
            enum: [needs_review, queued, inflight, sent, failed, frozen, cancelled]
      responses:
        '200': { description: Refund obligations, newest first. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [reserve]
      summary: Queue a refund by hand (admin or treasurer; rate limited 5/60s).
      description: |
        For inflows the driver deliberately refuses — unknown memo, wrong
        asset, a muxed or missing sender, or a row predating sender capture.
        The destination is explicit precisely because the bridge could not
        infer a safe one. Refused when it is the reserve account itself or
        the asset issuer (which would burn an issued asset).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paging_token: { type: string }
                destination: { type: string, description: Stellar G-address. }
                note: { type: string }
              required: [paging_token, destination]
      responses:
        '200': { description: Refund queued. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A refund already exists for this deposit. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve/refunds/{refund_id}/resolve:
    post:
      tags: [reserve]
      summary: Resolve a refund (admin or treasurer; rate limited 5/60s).
      description: |
        `approve` releases a reviewed refund to the driver; `cancel` drops
        one that never moved value; `sent` records one that did land (needs
        `stellar_tx_hash`); `reverse` restores the ledger for one that
        provably did not — refused until 600s after the claim AND only after
        the bridge verifies on-chain that no matching refund exists, because
        reversing a refund that landed would credit funds that left the chain.
      parameters:
        - in: path
          name: refund_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [approve, cancel, sent, reverse] }
                stellar_tx_hash: { type: string }
                note: { type: string }
              required: [action]
      responses:
        '200': { description: Refund resolved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not resolvable yet, or the state changed. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve/settings:
    put:
      tags: [reserve]
      summary: Reserve master switches (admin or treasurer).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refunds_enabled:
                  type: boolean
                  description: >
                    Master switch for automatic refunds. Default false; a
                    per-currency cap must ALSO be non-zero before anything is
                    sent.
              required: [refunds_enabled]
      responses:
        '200': { description: Settings updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/replenishment:
    get:
      tags: [reserve]
      summary: Replenishment policies and recent cycles (admin, treasurer, or auditor).
      responses:
        '200': { description: Policies plus cycle history. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/replenishment/policies/{kind}:
    put:
      tags: [reserve]
      summary: Set a replenishment policy (admin or treasurer).
      description: |
        `max_spend_minor` and `daily_spend_cap_minor` of 0 mean
        *unconfigured, refuse to run* — never "unlimited" — so enabling a
        kind whose caps are still 0 is rejected rather than producing a
        policy that looks armed and silently never runs. `min_float_minor`
        must cover the Stellar base reserve plus fees, or customer payouts
        begin failing. `min_price_minor` and `max_slippage_bps` are the
        guards that stop a mispriced quote dumping the float.
      parameters:
        - in: path
          name: kind
          required: true
          schema: { type: string, enum: [xlm_to_usdc, usdc_to_usd] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplenishPolicyUpdateRequest' }
      responses:
        '200': { description: Policy updated. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exchange-reserve/replenishment/run:
    post:
      tags: [reserve]
      summary: Start one replenishment cycle now (admin or treasurer; rate limited 5/60s).
      description: |
        Takes the reserve watcher's advisory lock and returns 409 if the
        watcher is mid-tick — the reserve account signs from a single
        sequence number, so two concurrent submissions would collide. A 200
        with no cycle id means a guard declined it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [xlm_to_usdc, usdc_to_usd] }
              required: [kind]
      responses:
        '200': { description: Cycle started, or a guard declined it. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The watcher is mid-tick; retry shortly. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve/replenishment/{cycle_id}/confirm-fiat:
    post:
      tags: [reserve]
      summary: Confirm a bank credit landed (admin or treasurer; rate limited 5/60s).
      description: |
        The bridge can see USDC leave and the provider's transfer status, but
        never a bank credit — so a completed off-ramp books the fiat into
        `held` as *in transit* and stays there until this call moves it into
        `available`. The one step that cannot be automated honestly.
      parameters:
        - in: path
          name: cycle_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_usd_cents:
                  type: integer
                  format: int64
                  description: Actual cents received, if it differs from the provider's figure.
                external_ref: { type: string }
                note: { type: string }
      responses:
        '200': { description: Confirmed; the float is spendable. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not awaiting confirmation. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve/replenishment/{cycle_id}/write-off:
    post:
      tags: [reserve]
      summary: Write off in-transit fiat that never arrived (admin or treasurer).
      description: |
        Writes off real money and is loudly audited; a note is required.
        Without it the USD `held` column stays poisoned and the kind stays
        permanently blocked.
      parameters:
        - in: path
          name: cycle_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
              required: [note]
      responses:
        '200': { description: Written off. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Not awaiting confirmation. }

  /admin/exchange-reserve/forecast:
    get:
      tags: [reserve]
      summary: Reserve utilization forecast (admin, treasurer, or auditor).
      description: |
        Integer-arithmetic projection over the journal's daily net flows:
        mean and EWMA (alpha 0.3) daily outflow, least-squares trend,
        projected days-to-depletion and date, suggested top-up for
        `target_days` of coverage, per-day series for charting, and
        per-provider diversion attribution.
      parameters:
        - in: query
          name: window_days
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
        - in: query
          name: target_days
          schema: { type: integer, default: 30, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: Forecast.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReserveForecastResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exchange-reserve/orders/{order_id}/disburse:
    post:
      tags: [reserve]
      summary: Complete a fiat disbursement order (admin or treasurer; rate limited 5/60s).
      description: |
        For reserve orders in `processing`/`awaiting_disbursement` (owlpay
        USDC->USD off-ramps): records that `amount_usd_cents` was paid from
        the USD float (bank/OwlPay balance), debits the USD bucket, releases
        the hold, and completes the order. The amount may not exceed 2x the
        recorded hold. Beneficiary details for the payout are in the order's
        server-side provider_payload (never returned to clients).
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveDisburseRequest' }
      responses:
        '200': { description: Disbursement recorded; order completed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order is not awaiting disbursement, or the float cannot cover it. }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/exchange-reserve/orders/{order_id}/resolve:
    post:
      tags: [reserve]
      summary: Resolve a frozen reserve order (admin or treasurer; rate limited 5/60s).
      description: |
        `complete` records a payout that did land on-chain (the server finds
        the transaction by the order's memo, or accepts `stellar_tx_hash`) —
        frozen (on_hold) auto-swap orders only. `fail` releases the hold:
        for frozen payouts it is refused while the order changed state less
        than 600s ago (every retry re-signs with a fresh ~300s validity
        window), when a matching on-chain payout is found, or when the chain
        cannot be checked (fail closed); for disbursement orders stuck in
        `processing`/`awaiting_disbursement` it cancels the fiat leg and
        releases the USD hold (their only other exit is a real
        disbursement).
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveResolveRequest' }
      responses:
        '200': { description: Order resolved. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Not resolvable yet (in-flight payout, or state changed). }
        '429': { $ref: '#/components/responses/RateLimited' }

  /sync:
    post:
      tags: [account]
      summary: Record a sync timestamp and reconcile against Soroban RPC.
      description: |
        Writes a per-account sync timestamp to Redis, then fetches
        `getTransactions` from the configured Soroban RPC and checks the
        returned ids against the local `transaction` table (read-only
        reconciliation). `account_id` is a Stellar G-address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRequest' }
      responses:
        '200':
          description: Sync timestamp recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }

  /sync/payala:
    post:
      tags: [account]
      summary: Ingest a batch of offline Payala transactions (reserve/mirror sync).
      description: |
        Owner-only (`account_id` is the caller's Payala account id — the JWT
        `sub`, not a Stellar address). The batch is applied atomically in one
        database transaction and is idempotent per
        `(account_id, payala_tx_id)`: replayed ids are reported as
        `duplicates` and an all-duplicate replay is a success with
        `applied = 0`. A replayed id whose stored amount/currency differ from
        this submission is additionally counted in `conflicting`.

        Application depends on the account's `sync_mode`:
        - `reserve`: the fresh items' per-currency net deltas are added to the
          account's reserve balances — one balance update per batch. The
          response echoes the current balances for the batch's currencies.
        - `mirror`: each fresh item is inserted 1:1 into the transaction table
          (`origin: payala_sync`), visible via `GET /transactions`.

        Amounts are signed integers in minor units (sign = direction) and are
        unverified client assertions; nothing is submitted on-chain. Rate
        limited per account (10 req / 60 s); max 500 items and 10 distinct
        currencies per batch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayalaSyncRequest' }
      responses:
        '200':
          description: Batch applied (or fully deduplicated).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayalaSyncResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /reserves/{account_id}:
    get:
      tags: [account]
      summary: Read an account's Payala reserve balances (owner or admin).
      description: |
        Returns the per-currency reserve balances accumulated by reserve-mode
        sync, plus the account's current `sync_mode`. Balances persist (and
        stay readable) after an account is switched to mirror mode. An account
        that has never synced in reserve mode returns an empty list.
      parameters:
        - in: path
          name: account_id
          required: true
          schema: { type: string }
          description: Payala account id.
      responses:
        '200':
          description: Reserve balances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReserveBalancesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /subscribe:
    post:
      tags: [subscription]
      summary: Subscribe to Stellar Horizon or Payala TCP event streams.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscribeRequest' }
      responses:
        '200':
          description: Stream subscription started (fire-and-forget).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscribeResponse' }

  /transactions:
    get:
      tags: [transaction]
      summary: List transactions with review state (admin/auditor=all, owner=own).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema: { type: string, enum: [unreviewed, cleared, flagged, escalated] }
        - in: query
          name: flagged
          schema: { type: boolean }
        - in: query
          name: source_account
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: Paginated transaction list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedTransactionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /transaction:
    post:
      tags: [transaction]
      summary: Record a dual-chain transaction.
      description: |
        At least one of `stellar_tx_id` or `payala_tx_id` must be supplied.
        A non-admin caller may only supply a `source_account` they own.
        Rate limited per account (10 req / 60 s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
      responses:
        '200':
          description: Transaction recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateTransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /transaction/{btxid}:
    get:
      tags: [transaction]
      summary: Get a single transaction with review state (admin or owner).
      parameters:
        - in: path
          name: btxid
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transaction/{btxid}/review:
    put:
      tags: [transaction]
      summary: Set a transaction's flag/status/note (admin only; PUT replaces review state).
      parameters:
        - in: path
          name: btxid
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewTransactionRequest' }
      responses:
        '200':
          description: Review updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewTransactionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /managed-account/generate:
    post:
      tags: [managed-account]
      summary: Generate a custodial Stellar account (owner-scoped).
      description: |
        Creates a fresh Stellar keypair server-side, protects the seed with the
        configured backend, and stores it. Only the public `G...` address is
        returned — the seed never leaves the bridge. Rate limited per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateManagedAccountRequest' }
      responses:
        '200':
          description: Managed account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /managed-account/import:
    post:
      tags: [managed-account]
      summary: Import an existing Stellar secret seed under custody (owner-scoped).
      description: |
        Takes a Stellar secret seed (`S...`), derives its public address,
        protects the seed with the configured backend, and stores it. Rate
        limited per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportManagedAccountRequest' }
      responses:
        '200':
          description: Managed account imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedAccountResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /managed-account/sign:
    post:
      tags: [managed-account]
      summary: Sign and submit a native payment from a custodial account (owner-scoped).
      description: |
        Loads the protected seed for the owner's account, signs a native (XLM)
        payment to `destination`, submits it to the network, and records the
        resulting transaction. Synchronous and server-only so a retry cannot
        double-submit. Rate limited per account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignSubmitRequest' }
      responses:
        '200':
          description: Payment signed and submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignSubmitResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /card:
    post:
      tags: [card]
      summary: Register a hardware smartcard.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCardRequest' }
      responses:
        '200':
          description: Card registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [card]
      summary: Soft-delete a card.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteCardRequest' }
      responses:
        '200':
          description: Card deleted or already gone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CardResponse' }

  /mfa:
    post:
      tags: [mfa]
      summary: Enroll a new MFA method (TOTP or SMS).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrollMfaRequest' }
      responses:
        '200':
          description: Enrollment result (TOTP returns provisioning_uri).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaResponse' }
    get:
      tags: [mfa]
      summary: List MFA enrollments for an account.
      parameters:
        - in: query
          name: account_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Enrollment list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MfaEnrollment' }

  /mfa/verify:
    post:
      tags: [mfa]
      summary: Verify an MFA code (TOTP or SMS).
      description: Constant-time comparison, lockout after 5 failures, rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyMfaRequest' }
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaResponse' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notify:
    get:
      tags: [notify]
      summary: List the authenticated user's notification destinations.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Paginated list of destinations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedNotifyList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [notify]
      summary: Create a notification destination.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNotifyRequest' }
      responses:
        '200':
          description: Destination created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyResponse' }
    put:
      tags: [notify]
      summary: Update a notification destination.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateNotifyRequest' }
      responses:
        '200':
          description: Destination updated.

  /notify/verify/send:
    post:
      tags: [notify]
      summary: Send (or resend) an SMS enrollment verification code.
      description: >
        Issues a code to the row's `mobile` and sends it by SMS. Adding or
        changing an SMS number already triggers this automatically; use it to
        retry a message that did not arrive, or when SMS delivery was
        unconfigured at the time the row was written.


        Rate limited per row and per account — each call is a billed message to
        a number the caller chose. Idempotent once verified: an already-verified
        row answers `200` without sending anything.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendNotifyVerificationRequest' }
      responses:
        '200':
          description: Code sent, or the number was already verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyVerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notify/verify:
    post:
      tags: [notify]
      summary: Confirm an SMS enrollment verification code.
      description: >
        Marks the row's `mobile` as verified, after which `dispatch_event`
        will deliver SMS to it. The code is bound to the number it was sent
        to: if the row's number changed in the meantime the code is discarded.


        A wrong code is counted; once the attempt budget is spent the code is
        destroyed and a fresh one must be requested. Every failure returns the
        same message and a `200` with `success: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyNotifyRequest' }
      responses:
        '200':
          description: >
            Verification result. `success: false` with `verified: false` is a
            rejected code, not a transport failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotifyVerificationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notification/subscriptions:
    get:
      tags: [subscription]
      summary: List the authenticated user's event subscriptions.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Paginated subscriptions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedSubscriptionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [subscription]
      summary: Create a new subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubscriptionRequest' }
      responses:
        '200':
          description: Subscription created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }

  /notification/subscriptions/{id}:
    put:
      tags: [subscription]
      summary: Update a subscription (toggle enabled).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSubscriptionRequest' }
      responses:
        '200':
          description: Subscription updated (success=false when not found).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [subscription]
      summary: Delete a subscription.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Subscription deleted (success=false when not found).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /device-token:
    post:
      tags: [device]
      summary: Register a Firebase Cloud Messaging device token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceTokenRequest' }
      responses:
        '200':
          description: Device registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTokenResponse' }
    delete:
      tags: [device]
      summary: Remove a device token.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteDeviceTokenRequest' }
      responses:
        '200': { description: Device removed. }

  /exchange/providers:
    get:
      tags: [exchange]
      summary: List exchange providers with configured/enabled state.
      responses:
        '200':
          description: Provider roster.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeProvidersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exchange/reference:
    get:
      tags: [exchange]
      summary: Provider reference data (tickers, pairs, fiat sub-providers).
      description: |
        Read-only passthrough of provider reference data — how a client
        discovers e.g. the `usdcxlm` ticker (`provider=changelly_crypto`,
        `kind=currencies`), tradable pairs (`kind=pairs`), Changelly Fiat
        currency coverage (`provider=changelly_fiat`, optional `type`/`flow`),
        or the fiat sub-provider codes like `moonpay` (`kind=providers`).
        Rate limited per account (10 req / 60 s).
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, enum: [changelly_crypto, changelly_fiat] }
        - in: query
          name: kind
          schema: { type: string, enum: [currencies, pairs, providers], default: currencies }
        - in: query
          name: type
          schema: { type: string, enum: [crypto, fiat] }
        - in: query
          name: flow
          schema: { type: string, enum: [buy, sell] }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
      responses:
        '200':
          description: Provider reference payload, passed through verbatim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeReferenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /exchange/owlpay/quotes/{quote_id}/requirements:
    get:
      tags: [exchange]
      summary: OwlPay corridor-specific transfer requirements for a quote.
      description: |
        Returns the JSON Schema (Draft 2020-12) that the `beneficiary` /
        `payout_instrument` passthroughs must satisfy when creating an order
        from this quote. Rate limited per account (10 req / 60 s).
      parameters:
        - in: path
          name: quote_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Requirements schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeReferenceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /exchange/quote:
    post:
      tags: [exchange]
      summary: Get a conversion quote/estimate from a provider.
      description: |
        Dispatches to the selected provider:
        `changelly_crypto` (float or fixed swap estimate, e.g. xlm -> usdcxlm),
        `changelly_fiat` (buy/sell offers across aggregated on/off-ramp
        providers; requires `country` and an end-user IP), or `owlpay`
        (Harbor v2 transfer quotes). Rate limited per account (10 req / 60 s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExchangeQuoteRequest' }
      responses:
        '200':
          description: Provider quotes (shape is provider-specific, passed through).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeQuoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /exchange/orders:
    post:
      tags: [exchange]
      summary: Create an exchange order (swap, on-ramp, or off-ramp).
      description: |
        Creates the order at the provider and records it in the local
        `exchange_order` ledger. Depending on provider/direction the response
        carries a crypto pay-in address (+ memo), a hosted redirect URL, or
        bank wire instructions. Rate limited per account (10 req / 60 s).

        **Conversion reserve:** when an admin-enabled reserve policy covers
        the requested provider and the order is under its $20-$200 threshold
        with a shape the bridge can serve end-to-end (changelly_crypto
        xlm->usdcxlm swaps to a trustline-holding Stellar address; owlpay
        Stellar-USDC->USD off-ramps with beneficiary details), the order is
        fulfilled from the bridge's own pool instead: the response's order has
        `provider: reserve`, `payin_address` (the reserve Stellar account) and
        a REQUIRED `payin_extra_id` text memo, and the quoted `amount_to` is
        honored for the pay-in window (default 30 min) stated in `message`.
        Clients should branch on `order.provider` — for `owlpay` requests this
        replaces the usual `transfer_instructions` response shape. Every
        reserve miss falls through to the provider transparently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateExchangeOrderRequest' }
      responses:
        '200':
          description: Order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeOrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [exchange]
      summary: List exchange orders (admin=all, owner=own).
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 20 }
        - in: query
          name: status
          schema:
            type: string
            enum: [created, awaiting_deposit, processing, on_hold, completed, failed, refunded, expired]
        - in: query
          name: provider
          schema:
            type: string
            enum: [owlpay, changelly_crypto, changelly_fiat, reserve]
        - in: query
          name: account_id
          description: Admin-only filter.
          schema: { type: string }
      responses:
        '200':
          description: Paginated order list.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedExchangeOrderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exchange/orders/{order_id}:
    get:
      tags: [exchange]
      summary: Get one exchange order (admin or owner).
      parameters:
        - in: path
          name: order_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: refresh
          description: When true, poll the provider for fresh status first.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Order detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeOrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/owlpay:
    post:
      tags: [exchange]
      summary: OwlPay Harbor webhook callback (unauthenticated; HMAC-verified).
      description: |
        Verified via the `harbor-signature` header — `t=<unix>,v1=<hex>` where
        `v1 = HMAC-SHA256(webhook_secret, "{t}.{raw body}")` — with a 5-minute
        replay window. Transfer status changes update the matching
        `exchange_order` row. Unknown orders are acknowledged with 200 so the
        provider stops retrying.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Acknowledged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/changelly:
    post:
      tags: [exchange]
      summary: Changelly Fiat API callback (unauthenticated; RSA-verified).
      description: |
        Verified via `x-callback-api-key` plus `x-callback-signature` (RSA
        PKCS#1 v1.5 / SHA-256 over `{"orderId":"<id>"}` with Changelly's
        callback public key). The callback payload itself is untrusted beyond
        the order id — order state is re-fetched from the Fiat API before the
        local row is updated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Acknowledged. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Temporal token (1-hour TTL). Obtain via `POST /token` with a valid
        refresh token. Send as `Authorization: Bearer <token>`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: impala_session
      description: |
        Browser session cookie (HttpOnly), established by `POST /session/login`
        or `POST /auth/okta` with `cookie_mode: true`. In production the cookie
        is `__Host-`-prefixed (`__Host-impala_session`). Unsafe-method requests
        additionally require the CSRF synchronizer token in the `X-CSRF-Token`
        header.

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or revoked token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Token is valid but the resource belongs to another account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Request conflicts with the current state (e.g. last admin).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "unauthorized" }
            message: { type: string }
          required: [code, message]
      required: [error]

    AuthenticateRequest:
      type: object
      properties:
        account_id: { type: string }
        password: { type: string, minLength: 8 }
      required: [account_id, password]

    AuthenticateResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        action:
          type: string
          enum: ["", registered, authenticated]

    TokenRequest:
      type: object
      description: Supply either `refresh_token` OR `username`+`password`.
      properties:
        username: { type: string, nullable: true }
        password: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }

    TokenResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        refresh_token: { type: string, nullable: true }
        temporal_token: { type: string, nullable: true }

    CreateAccountRequest:
      type: object
      properties:
        stellar_account_id: { type: string }
        payala_account_id: { type: string }
        first_name: { type: string, maxLength: 64 }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, maxLength: 64 }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }
      required: [stellar_account_id, payala_account_id, first_name, last_name]

    CreateAccountResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    GetAccountResponse:
      type: object
      properties:
        allowlisted:
          type: boolean
          description: >
            True when the account is on the live ADMIN_ACCOUNT_IDS allowlist,
            which overrides the stored role to admin at every token issuance.
            Not a DB column — computed by the handler.
        payala_account_id: { type: string }
        stellar_account_id: { type: string }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        role: { type: string, enum: [view-only, device, token, treasurer, key-custodian, auditor, admin] }
        sync_mode: { type: string, enum: [reserve, mirror] }
        profile_source: { type: string, enum: [local, ldap, okta] }
        profile_synced_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    UpdateAccountRequest:
      type: object
      description: Identify the target row by stellar_account_id (or payala_account_id). Admins may update any account.
      properties:
        stellar_account_id: { type: string, nullable: true }
        payala_account_id: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }

    UpdateAccountResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        rows_affected: { type: integer }

    AdminAccountListItem:
      type: object
      properties:
        allowlisted:
          type: boolean
          description: >
            True when the account is on the live ADMIN_ACCOUNT_IDS allowlist,
            which overrides the stored role to admin at every token issuance.
            Not a DB column — computed by the handler.
        payala_account_id: { type: string }
        stellar_account_id: { type: string }
        first_name: { type: string }
        middle_name: { type: string, nullable: true }
        last_name: { type: string }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }
        role: { type: string, enum: [view-only, device, token, treasurer, key-custodian, auditor, admin] }
        sync_mode: { type: string, enum: [reserve, mirror] }
        profile_source: { type: string, enum: [local, ldap, okta] }
        created_at: { type: string, format: date-time, nullable: true }

    PaginatedAccountList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AdminAccountListItem' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    SetRoleRequest:
      type: object
      properties:
        role: { type: string, enum: [view-only, device, token, treasurer, key-custodian, auditor, admin] }
      required: [role]

    SetRoleResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        account_id: { type: string }
        role: { type: string }
        allowlisted:
          type: boolean
          description: >
            True when the target sits on the ADMIN_ACCOUNT_IDS allowlist, which
            overrides the stored role to admin at every token issuance — a
            role change on an allowlisted account does not change effective
            privilege.

    SetSyncModeRequest:
      type: object
      properties:
        sync_mode: { type: string, enum: [reserve, mirror] }
        force:
          type: boolean
          nullable: true
          description: Required (true) to leave reserve mode while a nonzero balance remains.
      required: [sync_mode]

    SetSyncModeResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        account_id: { type: string }
        sync_mode: { type: string, enum: [reserve, mirror] }

    DeleteAccountResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        rows_affected: { type: integer }

    SyncedProfile:
      type: object
      properties:
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }

    SyncProfileResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        profile_source: { type: string }
        profile_synced_at: { type: string, format: date-time, nullable: true }
        profile: { $ref: '#/components/schemas/SyncedProfile' }

    OnchainBalance:
      type: object
      properties:
        asset_type: { type: string }
        asset_code: { type: string, nullable: true }
        asset_issuer: { type: string, nullable: true }
        balance: { type: string }

    OnchainSigner:
      type: object
      properties:
        key: { type: string }
        weight: { type: integer }
        type: { type: string }

    OnchainAccount:
      type: object
      properties:
        stellar_account_id: { type: string }
        exists: { type: boolean }
        sequence: { type: string, nullable: true }
        native_balance: { type: string, nullable: true }
        balances:
          type: array
          items: { $ref: '#/components/schemas/OnchainBalance' }
        signers:
          type: array
          items: { $ref: '#/components/schemas/OnchainSigner' }
        subentry_count: { type: integer, nullable: true }

    SyncRequest:
      type: object
      properties:
        account_id:
          type: string
          description: Stellar G-address.
      required: [account_id]

    SyncResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    PayalaSyncItemInput:
      type: object
      properties:
        payala_tx_id: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9]{1,128}$' }
        amount:
          type: integer
          format: int64
          description: Signed amount in minor units; sign = direction. Must not be 0.
        currency: { type: string, pattern: '^[A-Z0-9]{1,16}$' }
        memo:
          type: string
          maxLength: 256
          nullable: true
          description: Maximum 256 UTF-8 bytes.
        payala_digest:
          type: string
          maxLength: 256
          nullable: true
          description: Maximum 256 UTF-8 bytes.
      required: [payala_tx_id, amount, currency]

    PayalaSyncRequest:
      type: object
      properties:
        account_id:
          type: string
          description: Payala account id (the JWT sub) — NOT a Stellar address.
        transactions:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/PayalaSyncItemInput' }
      required: [account_id, transactions]

    PayalaSyncResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        batch_id: { type: string, format: uuid }
        sync_mode: { type: string, enum: [reserve, mirror] }
        received: { type: integer }
        applied: { type: integer }
        duplicates: { type: integer }
        conflicting:
          type: integer
          description: Replayed ids whose stored amount/currency differ from this submission.
        net_deltas:
          type: object
          description: Per-currency net delta over the applied items.
          additionalProperties: { type: integer, format: int64 }
        reserve_balances:
          type: array
          description: Current balances for the batch's currencies (reserve mode only).
          items: { $ref: '#/components/schemas/ReserveBalance' }

    ReserveBalance:
      type: object
      properties:
        currency: { type: string }
        balance: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time, nullable: true }

    ReserveBalancesResponse:
      type: object
      properties:
        account_id: { type: string }
        sync_mode: { type: string, enum: [reserve, mirror] }
        reserves:
          type: array
          items: { $ref: '#/components/schemas/ReserveBalance' }

    SubscribeRequest:
      type: object
      properties:
        network:
          type: string
          enum: [stellar, payala]
        listen_endpoint: { type: string, nullable: true }

    SubscribeResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    CreateTransactionRequest:
      type: object
      properties:
        stellar_tx_id: { type: string, nullable: true }
        payala_tx_id: { type: string, nullable: true }
        stellar_hash: { type: string, nullable: true }
        source_account: { type: string, nullable: true, description: "56-char Stellar account ID" }
        stellar_fee: { type: integer, nullable: true }
        stellar_max_fee: { type: integer, nullable: true }
        memo: { type: string, nullable: true, maxLength: 256 }
        signatures: { type: string, nullable: true }
        preconditions: { type: string, nullable: true }
        payala_currency: { type: string, nullable: true }
        payala_digest: { type: string, nullable: true }

    CreateTransactionResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        btxid: { type: string, format: uuid, nullable: true }

    TransactionListItem:
      type: object
      properties:
        btxid: { type: string, format: uuid }
        stellar_tx_id: { type: string, nullable: true }
        payala_tx_id: { type: string, nullable: true }
        stellar_hash: { type: string, nullable: true }
        source_account: { type: string, nullable: true }
        stellar_fee: { type: integer, nullable: true }
        stellar_max_fee: { type: integer, nullable: true }
        memo: { type: string, nullable: true }
        payala_currency: { type: string, nullable: true }
        payala_amount:
          type: integer
          format: int64
          nullable: true
          description: Signed minor units; set on mirror-mode rows only.
        origin:
          type: string
          enum: [manual, payala_sync]
          description: Server-set provenance; payala_sync rows come from mirror-mode sync.
        created_at: { type: string, format: date-time }
        flagged: { type: boolean }
        status: { type: string, enum: [unreviewed, cleared, flagged, escalated] }
        note: { type: string, nullable: true }
        reviewed_by: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }

    PaginatedTransactionList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TransactionListItem' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransactionListItem'
        - type: object
          properties:
            signatures: { type: string, nullable: true }
            preconditions: { type: string, nullable: true }
            payala_digest: { type: string, nullable: true }

    ReviewTransactionRequest:
      type: object
      description: PUT replaces the full review state; omitted fields reset.
      properties:
        flagged: { type: boolean, nullable: true }
        status: { type: string, enum: [unreviewed, cleared, flagged, escalated], nullable: true }
        note: { type: string, nullable: true, maxLength: 2000 }

    ReviewTransactionResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        btxid: { type: string, format: uuid }
        flagged: { type: boolean }
        status: { type: string }

    CreateCardRequest:
      type: object
      properties:
        account_id: { type: string }
        card_id: { type: string }
        ec_pubkey: { type: string }
        rsa_pubkey: { type: string }
      required: [account_id, card_id, ec_pubkey, rsa_pubkey]

    DeleteCardRequest:
      type: object
      properties:
        card_id: { type: string }
      required: [card_id]

    CardResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    EnrollMfaRequest:
      type: object
      properties:
        account_id: { type: string }
        mfa_type: { type: string, enum: [totp, sms] }
        secret:
          type: string
          nullable: true
          description: Accepted in the body but ignored — the TOTP secret is generated server-side.
        phone_number: { type: string, nullable: true }
      required: [account_id, mfa_type]

    VerifyMfaRequest:
      type: object
      properties:
        account_id: { type: string }
        mfa_type: { type: string, enum: [totp, sms] }
        code: { type: string }
      required: [account_id, mfa_type, code]

    MfaResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        provisioning_uri: { type: string, nullable: true }

    MfaEnrollment:
      type: object
      properties:
        account_id: { type: string }
        mfa_type: { type: string }
        secret: { type: string, nullable: true }
        phone_number: { type: string, nullable: true }
        enabled: { type: boolean }

    CreateNotifyRequest:
      type: object
      description: >
        A destination record. `medium` selects the channel; the per-channel
        fields carry the address(es). Only fields relevant to the medium need
        be set.
      properties:
        account_id: { type: string }
        medium: { type: string, enum: [webhook, sms, mobile_push, to_app, email] }
        mobile: { type: string, nullable: true }
        wa: { type: string, nullable: true, description: WhatsApp address. }
        signal: { type: string, nullable: true, description: Signal address. }
        tel: { type: string, nullable: true, description: Telephone number. }
        email: { type: string, nullable: true }
        url: { type: string, nullable: true, description: Webhook URL (SSRF-validated). }
        app: { type: string, nullable: true, description: In-app target. }
      required: [account_id, medium]

    UpdateNotifyRequest:
      type: object
      description: Identify the row by integer `id`; only supplied fields are updated.
      properties:
        id: { type: integer }
        medium: { type: string, enum: [webhook, sms, mobile_push, to_app, email], nullable: true }
        mobile: { type: string, nullable: true }
        wa: { type: string, nullable: true }
        signal: { type: string, nullable: true }
        tel: { type: string, nullable: true }
        email: { type: string, nullable: true }
        url: { type: string, nullable: true }
        app: { type: string, nullable: true }
      required: [id]

    NotifyResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: integer, nullable: true }
        verification_required:
          type: boolean
          nullable: true
          description: >
            Present when the write left an SMS number awaiting confirmation.
            No SMS is delivered to the row until `POST /notify/verify`
            succeeds.
        verification_sent:
          type: boolean
          nullable: true
          description: >
            Whether a code was actually sent. `false` means the row is pending
            but nothing went out (SMS delivery unconfigured, or the send
            failed) — retry with `POST /notify/verify/send`.

    NotifyListItem:
      type: object
      properties:
        id: { type: integer }
        account_id: { type: string }
        medium: { type: string, enum: [webhook, sms, mobile_push, to_app, email] }
        mobile: { type: string, nullable: true }
        wa: { type: string, nullable: true }
        signal: { type: string, nullable: true }
        tel: { type: string, nullable: true }
        email: { type: string, nullable: true }
        url: { type: string, nullable: true }
        app: { type: string, nullable: true }
        mobile_verified_at:
          type: string
          nullable: true
          description: >
            When the recipient confirmed `mobile`, RFC3339. Null means SMS for
            this row is inert — dispatch skips it.

    PaginatedNotifyList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/NotifyListItem' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    SendNotifyVerificationRequest:
      type: object
      properties:
        notify_id: { type: integer }
      required: [notify_id]

    VerifyNotifyRequest:
      type: object
      properties:
        notify_id: { type: integer }
        code: { type: string, description: The code the recipient received by SMS. }
      required: [notify_id, code]

    NotifyVerificationResponse:
      type: object
      properties:
        success: { type: boolean }
        message:
          type: string
          description: >
            Every rejection reason returns one indistinguishable message, so a
            caller cannot learn whether a code is currently in flight.
        verified:
          type: boolean
          description: The row's verification state after this call.
      required: [success, message, verified]

    CreateSubscriptionRequest:
      type: object
      properties:
        event_type:
          type: string
          enum: [login_success, login_failure, password_change, transfer_incoming, transfer_outgoing, profile_updated]
        medium:
          type: string
          enum: [webhook, sms, mobile_push, to_app, email]
      required: [event_type, medium]

    UpdateSubscriptionRequest:
      type: object
      properties:
        enabled: { type: boolean }

    SubscriptionResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: integer, nullable: true }

    SubscriptionListItem:
      type: object
      properties:
        id: { type: integer }
        event_type:
          type: string
          enum: [login_success, login_failure, password_change, transfer_incoming, transfer_outgoing, profile_updated]
        medium:
          type: string
          enum: [webhook, sms, mobile_push, to_app, email]
        enabled: { type: boolean }

    PaginatedSubscriptionList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionListItem' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    RegisterDeviceTokenRequest:
      type: object
      description: >
        The account is taken from the bearer token, not the body. `platform`
        defaults to `android` when omitted.
      properties:
        token: { type: string, description: FCM device token. }
        platform:
          type: string
          default: android
          description: Client platform, e.g. android or ios.
      required: [token]

    DeleteDeviceTokenRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]

    DeviceTokenResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: healthy }
        database: { type: string, enum: [ok, error] }
        redis: { type: string, enum: [ok, error] }
        stellar_network: { type: string }
        key_resolution:
          type: string
          enum: [ok, degraded]
          description: >
            `degraded` means an imported provider credential could not be used
            at startup, so that provider is disabled for this process. Reported
            here rather than in /readyz: the orchestrator acts on readiness, and
            one unreadable credential row must degrade a provider rather than
            cycle every task in the fleet.

    VersionResponse:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        build_date: { type: string }
        rustc_version: { type: string }
        schema_version: { type: string, nullable: true }

    NetworkInfoResponse:
      type: object
      properties:
        stellar_network: { type: string, enum: [testnet, pubnet] }
        stellar_horizon_url: { type: string, format: uri }
        stellar_rpc_url: { type: string, format: uri }
        network_passphrase: { type: string }
        soroban_contract_id: { type: string, nullable: true }

    LogoutResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }

    SessionLoginRequest:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
      required: [username, password]

    SessionResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        account_id: { type: string }
        is_admin: { type: boolean }
        csrf_token:
          type: string
          description: CSRF synchronizer token for `X-CSRF-Token` on unsafe-method cookie requests.

    OktaTokenExchangeRequest:
      type: object
      properties:
        okta_token: { type: string, description: Okta access token. }
        cookie_mode:
          type: boolean
          default: false
          description: Establish an HttpOnly cookie session instead of returning bearer tokens.
      required: [okta_token]

    OktaConfigResponse:
      type: object
      properties:
        enabled: { type: boolean }
        issuer: { type: string, nullable: true }
        client_id: { type: string, nullable: true }
        authorization_endpoint: { type: string, nullable: true }
        token_endpoint: { type: string, nullable: true }
        scopes:
          type: array
          items: { type: string }
          nullable: true

    GoogleTokenExchangeRequest:
      type: object
      properties:
        id_token: { type: string, description: Google OIDC ID token. }
      required: [id_token]

    GoogleConfigResponse:
      type: object
      properties:
        enabled: { type: boolean }
        client_id: { type: string, nullable: true }

    GitHubTokenExchangeRequest:
      type: object
      description: >
        Supply `code` (+ optional `redirect_uri`) for the server-side
        code→token exchange, or a legacy `access_token`. At least one of
        `code`/`access_token` is required.
      properties:
        access_token: { type: string, nullable: true }
        code: { type: string, nullable: true }
        redirect_uri: { type: string, nullable: true }

    GitHubExchangeResponse:
      allOf:
        - $ref: '#/components/schemas/TokenResponse'
        - type: object
          properties:
            login: { type: string, nullable: true }
            display_name: { type: string, nullable: true }

    CardChallengeRequest:
      type: object
      properties:
        card_id: { type: string }
      required: [card_id]

    CardChallengeResponse:
      type: object
      properties:
        success: { type: boolean }
        challenge:
          type: string
          description: 32 random bytes, hex-encoded (64 chars); the card signs the raw bytes.
        expires_in: { type: integer, description: Challenge TTL in seconds. }

    CardTokenExchangeRequest:
      type: object
      properties:
        card_id: { type: string }
        signature:
          type: string
          description: Hex-encoded ASN.1 DER ECDSA-SHA256 signature from the card (INS_SIGN_AUTH).
      required: [card_id, signature]

    GenerateManagedAccountRequest:
      type: object
      properties:
        payala_account_id: { type: string }
        first_name: { type: string, maxLength: 64 }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, maxLength: 64 }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }
      required: [payala_account_id, first_name, last_name]

    ImportManagedAccountRequest:
      type: object
      properties:
        payala_account_id: { type: string }
        secret_seed:
          type: string
          description: Stellar secret seed (S...). Never stored in plaintext or echoed back.
        first_name: { type: string, maxLength: 64 }
        middle_name: { type: string, nullable: true }
        last_name: { type: string, maxLength: 64 }
        nickname: { type: string, nullable: true }
        affiliation: { type: string, nullable: true }
        gender: { type: string, nullable: true }
      required: [payala_account_id, secret_seed, first_name, last_name]

    ManagedAccountResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        stellar_account_id: { type: string, nullable: true }

    SignSubmitRequest:
      type: object
      properties:
        payala_account_id: { type: string }
        destination: { type: string, description: Destination Stellar G-address. }
        amount: { type: string, description: Native (XLM) amount as a decimal string. }
        memo: { type: string, nullable: true }
        fee: { type: integer, nullable: true, description: Base fee in stroops. }
      required: [payala_account_id, destination, amount]

    SignSubmitResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        stellar_hash: { type: string, nullable: true }
        btxid: { type: string, format: uuid, nullable: true }

    RegisterWebhookRequest:
      type: object
      properties:
        url: { type: string, description: Callback URL (SSRF-validated). }
        event_types:
          type: array
          items: { type: string }
          nullable: true
          description: Event types to deliver; omit or empty for all.
      required: [url]

    RegisterWebhookResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        secret:
          type: string
          description: HMAC-SHA256 signing secret. Returned once; verify the `X-Impala-Signature` header with it.

    WebhookInfo:
      type: object
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        event_types:
          type: array
          items: { type: string }
          nullable: true
        enabled: { type: boolean }
        failure_count: { type: integer }
        last_error: { type: string, nullable: true }
        last_delivery_at: { type: string, nullable: true }
        created_at: { type: string }

    EventFeedItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        event_type: { type: string }
        account_id: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: Event-specific JSON payload.
        created_at: { type: string }

    EventFeedResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/EventFeedItem' }

    ExchangeProviderStatus:
      type: object
      properties:
        provider:
          type: string
          enum: [owlpay, changelly_crypto, changelly_fiat]
        enabled: { type: boolean }
        directions:
          type: array
          items:
            type: string
            enum: [fiat_to_crypto, crypto_to_fiat, crypto_to_crypto]
      required: [provider, enabled, directions]

    ExchangeProvidersResponse:
      type: object
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/ExchangeProviderStatus' }
      required: [providers]

    ExchangeReferenceResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data:
          description: Provider reference payload, passed through verbatim.
          nullable: true
      required: [success, message]

    ExchangeQuoteRequest:
      type: object
      properties:
        provider:
          type: string
          enum: [owlpay, changelly_crypto, changelly_fiat]
        direction:
          type: string
          enum: [fiat_to_crypto, crypto_to_fiat, crypto_to_crypto]
        from_currency: { type: string, example: "xlm" }
        to_currency: { type: string, example: "usdcxlm" }
        amount_from:
          type: string
          description: Decimal string; amounts are never floats.
          example: "250.0"
        rate_type:
          type: string
          enum: [float, fixed]
          description: changelly_crypto only (default float).
        reserve_lock:
          type: boolean
          description: >
            Ask the bridge to lock this price AND reserve the pool capacity
            behind it, so an order created from the returned quote cannot
            fail for lack of funds. Best effort: when no lock is available
            the response is unchanged. Rate limited 5/60s on its own scope.
        payout_address:
          type: string
          description: >
            Required with reserve_lock for crypto->crypto shapes — the
            trustline check and the lock are bound to THIS address, and an
            order consuming the quote must present it byte-for-byte.
        payout_extra_id:
          type: string
        country: { type: string, description: "changelly_fiat: ISO 3166-1 alpha-2." }
        state: { type: string, description: "changelly_fiat: required when country=US." }
        user_ip: { type: string, description: "changelly_fiat: end-user IP (falls back to X-Forwarded-For)." }
        source_country: { type: string, description: "owlpay quote source country." }
        destination_country: { type: string, description: "owlpay quote destination country." }
        source_chain: { type: string, description: "owlpay: source chain for crypto legs (e.g. stellar)." }
        destination_chain: { type: string, description: "owlpay: destination chain for crypto legs." }
        customer_type:
          type: string
          enum: [individual, business]
          description: owlpay (default individual).
      required: [provider, direction, from_currency, to_currency, amount_from]

    ExchangeQuoteResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        quotes:
          description: Provider-specific quote payload, passed through verbatim.
          nullable: true
        reserve_quote:
          allOf: [{ $ref: '#/components/schemas/ReserveQuoteView' }]
          nullable: true
          description: >
            A bridge-issued price lock, present only when one was issued.
            Absence means "no lock available" and nothing more — a reason
            would leak pool state. Deliberately carries no pool internals.
      required: [success, message]

    CreateExchangeOrderRequest:
      type: object
      properties:
        account_id: { type: string, description: Payala account id (must be owned by the caller). }
        provider:
          type: string
          enum: [owlpay, changelly_crypto, changelly_fiat]
        direction:
          type: string
          enum: [fiat_to_crypto, crypto_to_fiat, crypto_to_crypto]
        from_currency: { type: string }
        to_currency: { type: string }
        amount_from: { type: string, description: Decimal string. }
        payout_address: { type: string, description: Destination crypto address (swap payout / on-ramp wallet). }
        payout_extra_id: { type: string, description: Destination memo/tag where the chain requires one. }
        refund_address: { type: string, description: Refund address in the source currency. }
        refund_extra_id: { type: string }
        rate_type: { type: string, enum: [float, fixed], description: changelly_crypto. }
        rate_id: { type: string, description: "changelly_crypto: fixed-rate quote id (required for fixed)." }
        reserve_quote_id:
          type: string
          format: uuid
          description: >
            A bridge-issued conversion-reserve quote id. Honors exactly the
            locked price. Cannot be combined with rate_id or
            rate_type=fixed (those are opaque PROVIDER contracts), and is
            rejected outright when the reserve is unconfigured rather than
            quietly becoming a provider order at a different price.
        quote_id: { type: string, description: "owlpay: Harbor v2 quote id (required)." }
        provider_code: { type: string, description: "changelly_fiat: aggregated provider (e.g. moonpay); required." }
        payment_method: { type: string, description: changelly_fiat payment method code. }
        country: { type: string }
        state: { type: string }
        user_ip: { type: string }
        return_success_url: { type: string, description: changelly_fiat buy redirect. }
        return_failed_url: { type: string }
        customer_uuid: { type: string, description: "owlpay: on_behalf_of customer (cus_...); required." }
        transfer_purpose: { type: string, description: owlpay transfer purpose enum value. }
        is_self_transfer: { type: boolean, description: owlpay. }
        beneficiary:
          type: object
          additionalProperties: true
          description: "owlpay: destination.beneficiary_info passthrough (per quote requirements schema)."
        payout_instrument:
          type: object
          additionalProperties: true
          description: "owlpay: destination.payout_instrument passthrough."
        source_payment_instrument:
          type: object
          additionalProperties: true
          description: "owlpay: source.payment_instrument passthrough (off-ramp/ACH-pull)."
      required: [account_id, provider, direction, from_currency, to_currency, amount_from]

    ExchangeOrderDetail:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        payala_account_id: { type: string }
        provider:
          type: string
          enum: [owlpay, changelly_crypto, changelly_fiat, reserve]
          description: >
            `reserve` marks an order fulfilled from the bridge's conversion
            reserve instead of an external provider (never requestable —
            small orders are diverted server-side when a reserve policy
            allows; such orders always carry payin_address + payin_extra_id).
        direction: { type: string, enum: [fiat_to_crypto, crypto_to_fiat, crypto_to_crypto] }
        from_currency: { type: string }
        to_currency: { type: string }
        amount_from: { type: string }
        amount_to: { type: string, nullable: true }
        status:
          type: string
          enum: [created, awaiting_deposit, processing, on_hold, completed, failed, refunded, expired]
        provider_status:
          type: string
          nullable: true
          description: Raw provider-side status string.
        provider_order_id: { type: string }
        payin_address:
          type: string
          nullable: true
          description: Where to send funds (changelly_crypto swaps).
        payin_extra_id:
          type: string
          nullable: true
          description: Memo/tag that MUST accompany the pay-in when present.
        payout_address: { type: string, nullable: true }
        payout_extra_id: { type: string, nullable: true }
        redirect_url:
          type: string
          nullable: true
          description: Hosted provider page (changelly_fiat buy/sell).
        transfer_instructions:
          type: object
          additionalProperties: true
          nullable: true
          description: OwlPay wire/deposit instructions (include the narrative as the wire memo).
        btxid: { type: string, format: uuid, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string }
        updated_at: { type: string, nullable: true }
      required: [order_id, payala_account_id, provider, direction, from_currency, to_currency, amount_from, status, provider_order_id, created_at]

    ExchangeOrderResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        order:
          allOf: [{ $ref: '#/components/schemas/ExchangeOrderDetail' }]
          nullable: true
      required: [success, message]

    PaginatedExchangeOrderList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ExchangeOrderDetail' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
      required: [data, page, per_page, total]

    ReservePolicyUpdateRequest:
      type: object
      properties:
        enabled: { type: boolean }
        threshold_usd_cents:
          type: integer
          format: int64
          minimum: 2000
          maximum: 20000
          description: The $20-$200 diversion threshold, in USD cents.
      required: [enabled, threshold_usd_cents]

    ReserveEntryRequest:
      type: object
      properties:
        currency: { type: string, example: USDC }
        kind:
          type: string
          enum: [topup, withdrawal, adjustment, held_adjustment]
        amount_minor:
          type: integer
          format: int64
          description: Positive magnitude for topup/withdrawal; signed otherwise.
        note: { type: string, maxLength: 500 }
      required: [currency, kind, amount_minor]

    ReserveDisburseRequest:
      type: object
      properties:
        amount_usd_cents: { type: integer, format: int64, minimum: 1 }
        external_ref: { type: string, description: Bank/OwlPay reference of the fiat payment. }
        note: { type: string }
      required: [amount_usd_cents]

    ReserveResolveRequest:
      type: object
      properties:
        action: { type: string, enum: [complete, fail] }
        stellar_tx_hash: { type: string, description: "complete: payout tx hash if the server cannot find it by memo." }
        note: { type: string }
      required: [action]

    ReserveBucketView:
      type: object
      properties:
        currency: { type: string }
        minor_scale: { type: integer, description: Decimal places of the minor unit (USDC/XLM 7, USD 2). }
        available_minor: { type: integer, format: int64 }
        held_minor: { type: integer, format: int64 }
        low_water_minor: { type: integer, format: int64 }
        onchain_balance: { type: string, nullable: true, description: Live Horizon balance (best-effort). }
      required: [currency, minor_scale, available_minor, held_minor, low_water_minor]

    KeyListResponse:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether KEY_IMPORT_ENABLED is on for this instance.
        protection_backend:
          type: string
          description: At-rest protection backend (kms | vault | none).
        degraded:
          type: boolean
          description: >
            True when some kind has a stored credential that failed to resolve
            at startup, leaving that provider disabled for this process. Also
            reported as `key_resolution` by GET /health. Deliberately NOT
            reflected in /readyz, which the orchestrator acts on.
        keys:
          type: array
          items: { $ref: '#/components/schemas/KeyView' }

    KeyView:
      type: object
      description: One credential kind — what is running, what is stored, and the gap.
      properties:
        kind: { type: string, enum: [owlpay, changelly_crypto, changelly_fiat] }
        parts:
          type: array
          items: { type: string }
          description: Part names this kind accepts (e.g. api_key, private_key).
        required_parts:
          type: array
          items: { type: string }
        effective_source:
          type: string
          enum: [env, db, unconfigured]
          description: Where THIS instance resolved its credential at startup.
        effective_fingerprint: { type: string, nullable: true }
        effective_version: { type: integer, nullable: true }
        active:
          type: boolean
          description: Whether the provider client was built and is serving.
        resolution_error:
          type: string
          nullable: true
          description: >
            Fixed-string reason a stored credential could not be used. Never
            derived from decrypted bytes.
        shadowed_env_fingerprint:
          type: string
          nullable: true
          description: >
            An environment credential a stored one is shadowing. The rotation
            is not finished until it is removed from the deployment.
        env_vars_set:
          type: array
          items: { type: string }
          description: Environment variables for this kind still set in this process.
        stored_state: { type: string, nullable: true, enum: [active, superseded, revoked] }
        stored_version: { type: integer, nullable: true }
        stored_fingerprint: { type: string, nullable: true }
        per_part_fingerprints:
          type: object
          additionalProperties: { type: string }
          description: >
            One-way digests over canonical parsed material. RSA keys are
            fingerprinted through their PUBLIC half.
        imported_by: { type: string, nullable: true }
        imported_at: { type: string, nullable: true, format: date-time }
        note: { type: string, nullable: true }
        replace_target_fingerprint:
          type: string
          nullable: true
          description: >
            The fingerprint a replacement would supersede — the stored
            credential if there is one, otherwise whatever this instance is
            running. This is the value `expected_fingerprint` must equal;
            clients read it from here rather than choosing between the other
            fingerprints themselves.
        confirm_phrase:
          type: string
          nullable: true
          description: >
            The exact phrase a replacement or revoke must echo, present
            whenever either is possible — including for a stored credential
            this instance failed to resolve, which is the row most likely to
            need recovering. Served rather than reconstructed by clients, so a
            client cannot drift from the server and hand operators a phrase
            that is always rejected.
        pending_restart:
          type: boolean
          description: >
            True when the stored credential differs from the one this instance
            is running — the normal state between an import and the deploy.
        in_flight_count:
          type: integer
          format: int64
          description: >
            Non-terminal orders and replenishment cycles riding this credential.
            Replacing while this is non-zero can strand provider references.
        history:
          type: array
          items: { $ref: '#/components/schemas/CredentialRow' }

    CredentialRow:
      type: object
      description: A stored credential version, without any secret material.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        version: { type: integer }
        state: { type: string, enum: [active, superseded, revoked] }
        set_fingerprint: { type: string }
        fingerprints:
          type: object
          additionalProperties: { type: string }
        imported_by: { type: string }
        imported_at: { type: string, nullable: true, format: date-time }
        superseded_at: { type: string, nullable: true, format: date-time }
        scrubbed_at:
          type: string
          nullable: true
          format: date-time
          description: >
            When the ciphertext was cleared. Superseded versions are scrubbed
            after the overlap grace; revoked ones immediately.
        note: { type: string, nullable: true }

    ImportKeyRequest:
      type: object
      required: [parts]
      properties:
        parts:
          type: object
          additionalProperties: { type: string }
          description: >
            Secret parts keyed by part name. GET /admin/keys lists the names
            each kind expects. RSA private keys are accepted in the encoding
            the provider issues (hex PKCS#8 for Changelly crypto, PEM for
            Changelly fiat).
        replace:
          type: boolean
          default: false
          description: Must be true to overwrite a credential already in effect.
        expected_fingerprint:
          type: string
          description: >
            The fingerprint currently in effect, echoed back. Anti-race and
            anti-mistake, NOT access control.
        confirm_phrase:
          type: string
          description: >
            Typed confirmation, exactly `replace {kind} {network}`. Deliberately
            not the fingerprint, which is on screen and copyable — naming the
            network is what catches the right key in the wrong environment.
        strand_in_flight:
          type: boolean
          default: false
          description: >
            Accept that in-flight orders/cycles may be stranded if the new
            credential belongs to a different provider account.
        skip_verify:
          type: boolean
          default: false
          description: Store without proving the credential against the provider.
        note:
          type: string
          description: >
            Operator note, stored in plaintext and shown in listings. Rejected
            if it looks like key material.

    MergeKeyRequest:
      type: object
      properties:
        set_parts:
          type: object
          additionalProperties: { type: string }
        drop_parts:
          type: array
          items: { type: string }
          description: >
            Parts to remove. Explicit because removing one is a capability
            change — dropping a webhook secret stops verifying deliveries.
        expected_fingerprint: { type: string }
        confirm_phrase: { type: string }
        strand_in_flight: { type: boolean, default: false }
        skip_verify: { type: boolean, default: false }
        note: { type: string }

    RevokeKeyRequest:
      type: object
      required: [expected_fingerprint]
      properties:
        expected_fingerprint: { type: string }
        confirm_phrase:
          type: string
          description: Exactly `replace {kind} {network}`.
        confirm_next_source:
          type: boolean
          default: false
          description: >
            Acknowledge what the provider falls back to after the next restart
            — an environment credential, or nothing at all.
        strand_in_flight:
          type: boolean
          default: false
          description: >
            Accept that in-flight orders and cycles will have nothing able to
            reconcile them once this credential stops being used.

    KeyActionResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        kind: { type: string }
        version: { type: integer, nullable: true }
        set_fingerprint: { type: string, nullable: true }
        effective_after:
          type: string
          description: >
            Always `rolling_restart` for credential changes: stored credentials
            are resolved once per process, so nothing changes until every task
            restarts.
        verify_note:
          type: string
          nullable: true
          description: Present when the provider probe was skipped or impossible.
        env_shadow_note:
          type: string
          nullable: true
          description: Names environment variables that must still be removed.

    AdminSeedRequest:
      type: object
      required: [payala_account_id]
      properties:
        payala_account_id: { type: string, maxLength: 64 }
        label:
          type: string
          maxLength: 32
          description: Display name for the account record created alongside the seed.

    AdminImportSeedRequest:
      type: object
      required: [payala_account_id, secret_seed]
      properties:
        payala_account_id: { type: string, maxLength: 64 }
        secret_seed:
          type: string
          description: Stellar secret seed (`S...`, 56 chars).
        replace: { type: boolean, default: false }
        expected_stellar_account_id:
          type: string
          description: >
            The address the stored seed currently derives, echoed back. The
            replacement must derive this SAME address.
        confirm_phrase:
          type: string
          description: Exactly `replace seed {last 6 chars of the current address}`.
        skip_verify:
          type: boolean
          default: false
          description: Store even when the on-chain probe says the key cannot authorize.

    SeedProbe:
      type: object
      description: What Horizon says about the account a submitted seed derives.
      properties:
        exists: { type: boolean }
        master_key_weight:
          type: integer
          nullable: true
          description: >
            Weight of the account's own master key. 0 means the key was
            disabled on chain and can authorize nothing.
        native_balance: { type: string, nullable: true }
        non_native_balances: { type: integer, format: int64 }

    AdminSeedResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        stellar_account_id: { type: string, nullable: true }
        on_chain:
          allOf: [{ $ref: '#/components/schemas/SeedProbe' }]
          nullable: true
        effective_after: { type: string }

    ReserveStatusResponse:
      type: object
      properties:
        configured: { type: boolean }
        stellar_address: { type: string, description: Reserve pay-in address. }
        deposit_ttl_secs: { type: integer, format: int64 }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/ReserveBucketView' }
        policies:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              enabled: { type: boolean }
              threshold_usd_cents: { type: integer, format: int64 }
              supported: { type: boolean }
              updated_at: { type: string }
        pending:
          type: object
          properties:
            awaiting_deposit: { type: integer, format: int64 }
            processing: { type: integer, format: int64 }
            on_hold: { type: integer, format: int64 }
            awaiting_disbursement: { type: integer, format: int64 }
      required: [configured, buckets, policies, pending]

    ReserveQuoteView:
      type: object
      properties:
        quote_id: { type: string, format: uuid }
        from_currency: { type: string }
        to_currency: { type: string }
        amount_from: { type: string }
        amount_to:
          type: string
          description: The locked payout, honored for expires_in_secs.
        expires_in_secs: { type: integer, format: int64 }
      required: [quote_id, from_currency, to_currency, amount_from, amount_to, expires_in_secs]

    ReplenishPolicyUpdateRequest:
      type: object
      properties:
        enabled: { type: boolean }
        target_days: { type: integer, minimum: 1, maximum: 365 }
        window_days: { type: integer, minimum: 1, maximum: 365 }
        min_need_minor: { type: integer, format: int64, minimum: 0 }
        max_spend_minor:
          type: integer
          format: int64
          minimum: 0
          description: Per-cycle ceiling. 0 means unconfigured — the cycle refuses to run.
        daily_spend_cap_minor:
          type: integer
          format: int64
          minimum: 0
          description: Rolling-24h ceiling. 0 means unconfigured.
        cooldown_secs: { type: integer, minimum: 60, maximum: 604800 }
        min_float_minor:
          type: integer
          format: int64
          minimum: 0
          description: Never spent — must cover the Stellar base reserve plus fees.
        min_price_minor:
          type: integer
          format: int64
          minimum: 0
          description: Recv minor units per whole spend unit. 0 disables the floor.
        max_slippage_bps: { type: integer, minimum: 0, maximum: 5000 }
      required: [enabled, target_days, window_days, min_need_minor, max_spend_minor,
                 daily_spend_cap_minor, cooldown_secs, min_float_minor, min_price_minor,
                 max_slippage_bps]

    ReserveEntryView:
      type: object
      properties:
        entry_id: { type: string, format: uuid }
        currency: { type: string }
        kind: { type: string }
        delta: { type: integer, format: int64, description: Signed effect on available. }
        held_delta: { type: integer, format: int64, description: Signed effect on held. }
        balance_after: { type: integer, format: int64 }
        held_after: { type: integer, format: int64 }
        order_id: { type: string, format: uuid, nullable: true }
        diverted_provider: { type: string, nullable: true }
        stellar_tx_hash: { type: string, nullable: true }
        admin_account_id: { type: string, nullable: true }
        note: { type: string, nullable: true }
        created_at: { type: string }
      required: [entry_id, currency, kind, delta, held_delta, balance_after, held_after, created_at]

    PaginatedReserveEntryList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReserveEntryView' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
      required: [data, page, per_page, total]

    ReserveUnmatchedView:
      type: object
      properties:
        paging_token: { type: string }
        tx_hash: { type: string }
        op_type: { type: string }
        asset_code: { type: string, nullable: true }
        asset_issuer: { type: string, nullable: true }
        amount: { type: string }
        amount_minor: { type: integer, format: int64, nullable: true }
        memo: { type: string, nullable: true }
        matched_order_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, enum: [late, underpaid, wrong_asset, no_match] }
        seen_at: { type: string }
      required: [paging_token, tx_hash, op_type, amount, reason, seen_at]

    PaginatedReserveUnmatchedList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ReserveUnmatchedView' }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer, format: int64 }
      required: [data, page, per_page, total]

    ReserveForecastResponse:
      type: object
      properties:
        window_days: { type: integer, format: int64 }
        target_days: { type: integer, format: int64 }
        as_of: { type: string, description: UTC date the projection is anchored to. }
        currencies:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              minor_scale: { type: integer }
              available_minor: { type: integer, format: int64 }
              held_minor: { type: integer, format: int64 }
              low_water_minor: { type: integer, format: int64 }
              low_water_breached: { type: boolean }
              avg_daily_outflow_minor: { type: integer, format: int64 }
              ewma_daily_outflow_minor: { type: integer, format: int64 }
              trend_minor_per_day: { type: integer, format: int64 }
              projected_days_to_depletion: { type: integer, format: int64, nullable: true }
              projected_depletion_date: { type: string, nullable: true }
              suggested_topup_minor: { type: integer, format: int64 }
              daily:
                type: array
                items:
                  type: object
                  properties:
                    day: { type: string }
                    outflow_minor: { type: integer, format: int64 }
                    inflow_minor: { type: integer, format: int64 }
        provider_utilization:
          type: array
          items:
            type: object
            properties:
              provider: { type: string }
              orders: { type: integer, format: int64 }
              volume_minor: { type: integer, format: int64 }
      required: [window_days, target_days, as_of, currencies, provider_utilization]
