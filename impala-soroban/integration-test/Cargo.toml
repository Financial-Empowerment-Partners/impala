[package]
name = "soroban-impala-integration-test"
# The release tag impala-soroban-v<version> matches this field.
version = "0.2.0"
edition = "2021"
# Matches the repository LICENSE-2.0.txt (checked by cargo-deny).
license = "Apache-2.0"
publish = false
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# pinned: 26.x attempt aborted — soroban-sdk 26's build.rs rejects the
# wasm32-unknown-unknown target on rustc 1.82+ and requires wasm32v1-none,
# which CI, docs, and testnet-tests all standardize against. cargo test passed
# on 26.1.0 and env.events().publish still exists (deprecated), so retrying
# only needs the coordinated wasm32v1-none target migration. (2026-06-09)
# The migration is a separate PR and must land before any mainnet deployment;
# see README "Dependencies". The CI artifact gate
# (test_wasm_artifact_loads_in_pinned_host) is the acceptance check for the
# current pin.
soroban-sdk = { version = "27.0.6" }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
# std only: drops rusty-fork/tempfile/wait-timeout from the audited tree.
proptest = { version = "1.10", default-features = false, features = ["std"] }

[profile.release]
debug = 0
opt-level = "z"
overflow-checks = true
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
