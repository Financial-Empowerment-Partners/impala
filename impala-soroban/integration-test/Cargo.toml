[package]
name = "soroban-impala-integration-test"
version = "0.0.1"
edition = "2021"
publish = false
rust-version = "1.91"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
# pinned: 26.x attempt aborted — soroban-sdk 26's build.rs rejects the
# wasm32-unknown-unknown target on rustc 1.82+ and requires wasm32v1-none,
# which CI, docs, and testnet-tests all standardize against. cargo test passed
# on 26.1.0 and env.events().publish still exists (deprecated), so retrying
# only needs the coordinated wasm32v1-none target migration. (2026-06-09)
soroban-sdk = { version = "26.1.0" }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

[profile.release]
debug = 0
opt-level = "z"
overflow-checks = true
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
