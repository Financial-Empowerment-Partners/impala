worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Compress text responses (static assets + proxied JSON API responses).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # HSTS: if TLS is terminated UPSTREAM (ALB/ingress) and this nginx
        # only ever receives forwarded HTTPS traffic, uncomment here. If TLS
        # terminates in this nginx, use the 443 server block template at the
        # bottom of this file instead (HSTS on a plain-HTTP listener is a
        # no-op browsers ignore).
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP: all scripts/styles are same-origin (Foundation/jQuery vendored
        # under /vendor/); style-src needs 'unsafe-inline' for Foundation and
        # the pages' inline style attributes; data: covers Foundation's
        # embedded icons. Okta-enabled deployments must append the Okta org
        # origin to connect-src (the PKCE code exchange is a browser-side
        # fetch to the org's token endpoint), e.g.:
        #   connect-src 'self' https://your-org.okta.com;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

        # Two-bridge routing: each Stellar network is served by its own bridge
        # deployment. The UI selects the network and routes /api/<network>/* to
        # the matching upstream. JWTs are namespaced per network client-side.
        location /api/testnet/ {
            proxy_pass http://testnet-bridge:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/mainnet/ {
            proxy_pass http://mainnet-bridge:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Legacy default upstream (single-bridge / local dev fallback).
        location /api/ {
            proxy_pass http://impala-bridge:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # ── TLS server template (disabled until certificates are mounted) ──────
    # To enable: mount fullchain.pem + privkey.pem at /etc/nginx/certs/ (and
    # map a host port to 443 in docker-compose.yml, e.g. "3443:443"), then
    # uncomment this whole block and run `nginx -t` before reloading.
    #
    # IMPORTANT nginx gotcha: `add_header` directives are inherited from the
    # http{} / server{} level ONLY if a block declares none of its own — any
    # add_header in a child context silently drops all inherited ones. That
    # is why every security header is re-declared here in full.
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name localhost;
    #     root /usr/share/nginx/html;
    #     index index.html;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_tickets off;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header X-Frame-Options "DENY" always;
    #     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #     add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    #     # Keep in sync with the port-80 CSP above (incl. the Okta
    #     # connect-src note there).
    #     add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    #
    #     location /api/ {
    #         proxy_pass http://impala-bridge:8080/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_connect_timeout 10s;
    #         proxy_send_timeout 30s;
    #         proxy_read_timeout 30s;
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ =404;
    #     }
    # }
}
