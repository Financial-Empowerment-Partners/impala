<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impala - Cards</title>
    <link rel="stylesheet" href="vendor/foundation.min.css" integrity="sha384-2ZAo6d0r9zxtxn7DvMBmpd3hscGP+LkxQ/kMShaUz/TqqsBPtbtZ1K3+3/CgndDu">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="top-bar" id="main-nav"></div>
    <div id="toast-container" class="toast-container"></div>

    <div class="grid-container">
        <div class="page-header">
            <h3>Smartcards</h3>
        </div>

        <!-- Register Card -->
        <div class="card" data-permission="manage_cards">
            <div class="card-section">
                <h5>Register Card</h5>
                <form id="register-form">
                    <div class="grid-x grid-margin-x">
                        <div class="cell medium-6">
                            <label>Account ID
                                <input type="text" id="reg-account-id" required>
                            </label>
                        </div>
                        <div class="cell medium-6">
                            <label>Card ID
                                <input type="text" id="reg-card-id" required>
                            </label>
                        </div>
                        <div class="cell medium-6">
                            <label>EC Public Key (hex)
                                <input type="text" id="reg-ec-pubkey" required>
                            </label>
                        </div>
                        <div class="cell medium-6">
                            <label>RSA Public Key (hex)
                                <input type="text" id="reg-rsa-pubkey">
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="button">Register Card</button>
                </form>
            </div>
        </div>

        <!-- Deactivate Card -->
        <div class="card" data-permission="manage_cards">
            <div class="card-section">
                <h5>Deactivate Card</h5>
                <form id="deactivate-form">
                    <div class="grid-x grid-margin-x">
                        <div class="cell medium-6">
                            <label>Account ID
                                <input type="text" id="deact-account-id" required>
                            </label>
                        </div>
                        <div class="cell medium-6">
                            <label>Card ID
                                <input type="text" id="deact-card-id" required>
                            </label>
                        </div>
                    </div>
                    <button type="button" class="button alert" id="deact-btn">Deactivate Card</button>
                </form>
            </div>
        </div>

        <!-- Confirmation Modal -->
        <div class="reveal" id="confirm-modal" data-reveal style="max-width:450px;" role="alertdialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-desc">
            <h5 id="confirm-modal-title">Confirm Deactivation</h5>
            <p id="confirm-modal-desc">Are you sure you want to deactivate this card? This action cannot be undone.</p>
            <p><strong>Account:</strong> <span id="confirm-account"></span></p>
            <p><strong>Card:</strong> <span id="confirm-card"></span></p>
            <div class="grid-x grid-margin-x">
                <div class="cell medium-6">
                    <button class="button alert expanded" id="confirm-yes">Yes, Deactivate</button>
                </div>
                <div class="cell medium-6">
                    <button class="button secondary expanded" id="confirm-no">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs"></script>
    <script src="vendor/foundation.min.js" integrity="sha384-aIzMo8wrK01Ha4yHuRC7+ttQyih1mBL9y+g0q06AvY1ZYU+lQpYeOS340JDX0gPM"></script>
    <script src="config.js"></script>
    <script src="js/escape-html.js"></script>
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/net-config.js"></script>
    <script src="js/net.js"></script>
    <script src="js/session-timer.js"></script>
    <script src="js/router.js"></script>
    <script src="js/cards.js"></script>
</body>
</html>
