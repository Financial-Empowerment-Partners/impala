<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impala - Login</title>
    <link rel="stylesheet" href="vendor/foundation.min.css" integrity="sha384-2ZAo6d0r9zxtxn7DvMBmpd3hscGP+LkxQ/kMShaUz/TqqsBPtbtZ1K3+3/CgndDu">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Impala</h2>
            <div class="login-net" id="net-selector"></div>
            <div id="login-error" class="callout alert hidden"></div>
            <form id="login-form">
                <label>Account ID
                    <input type="text" id="account-id" placeholder="Enter account ID" required>
                </label>
                <label>Password
                    <input type="password" id="password" placeholder="Enter password" required>
                </label>
                <button type="submit" class="button expanded" id="login-btn">Login</button>
            </form>
            <div id="sso-divider" class="hidden" style="text-align:center;margin:1.2rem 0 0.8rem;">
                <span style="display:inline-block;width:40%;border-bottom:1px solid #ccc;vertical-align:middle;"></span>
                <span style="padding:0 0.7rem;color:#888;font-size:0.9rem;">or</span>
                <span style="display:inline-block;width:40%;border-bottom:1px solid #ccc;vertical-align:middle;"></span>
            </div>
            <div id="sso-buttons"></div>
            <p class="text-center" style="margin-top:1rem;font-size:0.85rem;color:#666;">
                New accounts are registered automatically on first login.
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/escape-html.js"></script>
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/net-config.js"></script>
    <script src="js/net.js"></script>
    <script src="js/sso-auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
