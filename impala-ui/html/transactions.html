<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impala - Transactions</title>
    <link rel="stylesheet" href="vendor/foundation.min.css" integrity="sha384-2ZAo6d0r9zxtxn7DvMBmpd3hscGP+LkxQ/kMShaUz/TqqsBPtbtZ1K3+3/CgndDu">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="top-bar" id="main-nav"></div>
    <div id="toast-container" class="toast-container"></div>

    <div class="grid-container" id="main-content" tabindex="-1">
        <div class="page-header">
            <h3>Transactions</h3>
        </div>

        <!-- Create Transaction -->
        <div class="card" data-permission="create_transactions">
            <div class="card-section">
                <h5>Create Transaction</h5>
                <form id="tx-form">
                    <div class="grid-x grid-margin-x">
                        <div class="cell medium-6">
                            <label>Source Account
                                <input type="text" id="tx-source" required>
                            </label>
                        </div>
                        <div class="cell medium-6">
                            <label>Destination Account
                                <input type="text" id="tx-destination" required>
                            </label>
                        </div>
                        <div class="cell medium-4">
                            <label>Amount
                                <input type="number" id="tx-amount" step="0.01" min="0" required>
                            </label>
                        </div>
                        <div class="cell medium-4">
                            <label>Asset Code
                                <input type="text" id="tx-asset-code" placeholder="e.g. XLM">
                            </label>
                        </div>
                        <div class="cell medium-4">
                            <label>Memo
                                <input type="text" id="tx-memo">
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="button">Submit Transaction</button>
                </form>
            </div>
        </div>

        <!-- Transaction Log -->
        <div class="card">
            <div class="card-section">
                <h5>Transaction Log</h5>
                <div class="filter-bar">
                    <div class="field">
                        <label for="tx-filter-status">Status</label>
                        <select id="tx-filter-status">
                            <option value="">All</option>
                            <option value="unreviewed">Unreviewed</option>
                            <option value="cleared">Cleared</option>
                            <option value="flagged">Flagged</option>
                            <option value="escalated">Escalated</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="tx-filter-flagged">Flagged</label>
                        <select id="tx-filter-flagged">
                            <option value="">All</option>
                            <option value="true">Flagged</option>
                            <option value="false">Not flagged</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="tx-filter-from">From</label>
                        <input type="date" id="tx-filter-from">
                    </div>
                    <div class="field">
                        <label for="tx-filter-to">To</label>
                        <input type="date" id="tx-filter-to">
                    </div>
                    <div class="field">
                        <label for="tx-filter-q">Search</label>
                        <input type="search" id="tx-filter-q" placeholder="memo, id, hash, source">
                    </div>
                    <div class="field">
                        <button class="button" id="tx-filter-apply">Apply</button>
                    </div>
                    <div class="field">
                        <button class="button ghost" id="tx-filter-reset">Reset</button>
                    </div>
                </div>
                <div id="tx-list"></div>
                <div id="tx-pagination"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/escape-html.js"></script>
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/paginate.js"></script>
    <script src="js/net-config.js"></script>
    <script src="js/net.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/tx-filter.js"></script>
    <script src="js/session-timer.js"></script>
    <script src="js/router.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
