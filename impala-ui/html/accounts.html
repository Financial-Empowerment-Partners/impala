<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impala - Accounts</title>
    <link rel="stylesheet" href="vendor/foundation.min.css" integrity="sha384-2ZAo6d0r9zxtxn7DvMBmpd3hscGP+LkxQ/kMShaUz/TqqsBPtbtZ1K3+3/CgndDu">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="top-bar" id="main-nav"></div>
    <div id="toast-container" class="toast-container"></div>

    <div class="grid-container" id="main-content" tabindex="-1">
        <div class="page-header">
            <h3>Accounts</h3>
            <div class="page-actions">
                <button class="button" id="new-account-btn" data-permission="manage_accounts">New Account</button>
            </div>
        </div>

        <div class="card">
            <div class="card-section">
                <div class="grid-x grid-margin-x">
                    <div class="cell medium-9">
                        <input type="search" id="accounts-search" placeholder="Search by name, Payala ID, or Stellar ID" aria-label="Search accounts">
                    </div>
                    <div class="cell medium-3">
                        <button class="button expanded ghost" id="accounts-search-btn">Search</button>
                    </div>
                </div>
                <div id="accounts-list"></div>
                <div id="accounts-pagination"></div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="js/escape-html.js"></script>
    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/roles.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/paginate.js"></script>
    <script src="js/net-config.js"></script>
    <script src="js/net.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/drawer.js"></script>
    <script src="js/session-timer.js"></script>
    <script src="js/router.js"></script>
    <script src="js/accounts.js"></script>
</body>
</html>
